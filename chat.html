<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;

    background:
    radial-gradient(circle at top right,#3b2470,transparent 35%),
    linear-gradient(135deg,#080812,#15132b);
}

nav{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(10,10,20,.85);

    border-bottom:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;

    padding:9px 14px;

    border:1px solid rgba(255,255,255,.2);

    border-radius:10px;
}

.container{
    width:92%;
    max-width:850px;
    margin:20px auto;
}

.profile{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:14px;

    padding:16px 18px;

    border-radius:18px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.1);

    margin-bottom:12px;
}

.profile-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.avatar{
    width:55px;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:26px;

    background:linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );
}

.profile h2{
    margin-bottom:4px;
}

.online{
    color:#62e27c;
    font-size:13px;
}


/* CALL BUTTONS */

.call-buttons{
    display:flex;
    gap:8px;
}

.call-btn{
    border:none;

    padding:10px 13px;

    border-radius:10px;

    color:white;

    cursor:pointer;

    font-size:14px;

    background:rgba(255,255,255,.1);

    border:1px solid rgba(255,255,255,.15);
}

.call-btn:hover{
    background:rgba(255,255,255,.18);
}

.video-btn{
    background:linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );
}

.call-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* CHAT */

.chat{
    height:650px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border-radius:20px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.1);
}

.chat-header{
    padding:15px 18px;

    border-bottom:1px solid rgba(255,255,255,.08);
}

.chat-header h3{
    margin-bottom:4px;
}

.chat-header p{
    color:#999;
    font-size:12px;
}

.messages{
    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.message{
    max-width:75%;

    padding:11px 14px;

    border-radius:16px;

    line-height:1.4;

    font-size:14px;

    word-wrap:break-word;
}

.received{
    align-self:flex-start;

    background:rgba(255,255,255,.1);

    border-bottom-left-radius:4px;
}

.sent{
    align-self:flex-end;

    background:linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

    border-bottom-right-radius:4px;
}

.time{
    display:block;

    text-align:right;

    font-size:9px;

    opacity:.6;

    margin-top:4px;
}

.empty{
    margin:auto;

    text-align:center;

    color:#888;

    padding:30px;
}

.input-area{
    display:flex;
    align-items:center;

    gap:8px;

    padding:12px;

    background:rgba(8,8,18,.9);

    border-top:1px solid rgba(255,255,255,.08);
}

.input-area button{
    width:42px;
    height:42px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.1);

    color:white;

    cursor:pointer;

    font-size:17px;
}

.input-area input{
    flex:1;

    padding:13px;

    border:none;

    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.1);

    color:white;

    font-size:14px;
}

.input-area input::placeholder{
    color:#888;
}

.send{
    background:linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    )!important;
}


/* ERROR */

.error{
    display:none;

    padding:12px;

    margin-bottom:12px;

    text-align:center;

    border-radius:12px;

    color:#ff9b9b;

    background:rgba(220,60,70,.15);
}

.success{
    display:none;

    padding:12px;

    margin-bottom:12px;

    text-align:center;

    border-radius:12px;

    color:#9be6a5;

    background:rgba(70,200,120,.15);
}


/* CALL MODAL */

.call-modal{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.85);

    z-index:9999;
}

.call-box{
    width:90%;
    max-width:850px;

    padding:20px;

    border-radius:20px;

    background:#11111d;

    border:1px solid rgba(255,255,255,.15);
}

.call-title{
    text-align:center;

    margin-bottom:15px;
}

.video-area{
    position:relative;

    width:100%;

    aspect-ratio:16/9;

    overflow:hidden;

    border-radius:15px;

    background:#050509;
}

#remoteVideo{
    width:100%;
    height:100%;

    object-fit:cover;

    background:#050509;
}

#localVideo{
    position:absolute;

    right:15px;
    bottom:15px;

    width:180px;
    height:120px;

    object-fit:cover;

    border-radius:12px;

    background:#222;

    border:2px solid white;
}

.audio-placeholder{
    display:none;

    height:300px;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:15px;

    font-size:60px;
}

.audio-placeholder p{
    font-size:18px;
}

.call-controls{
    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:15px;
}

.end-call{
    border:none;

    padding:13px 22px;

    border-radius:12px;

    color:white;

    background:#d9364f;

    cursor:pointer;

    font-weight:bold;
}

.mute-btn{
    border:none;

    padding:13px 22px;

    border-radius:12px;

    color:white;

    background:#333345;

    cursor:pointer;
}

@media(max-width:600px){

    .container{
        width:96%;
    }

    .chat{
        height:600px;
    }

    .message{
        max-width:85%;
    }

    .logo{
        font-size:17px;
    }

    .profile{
        align-items:flex-start;
        flex-direction:column;
    }

    .call-buttons{
        width:100%;
    }

    .call-btn{
        flex:1;
    }

    #localVideo{
        width:120px;
        height:85px;
    }
}

</style>

</head>

<body>

<nav>

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a
        href="connections.html"
        class="back"
    >
        ← Connections
    </a>

</nav>


<div class="container">

    <div id="error" class="error"></div>

    <div id="success" class="success"></div>


    <div class="profile">

        <div class="profile-left">

            <div class="avatar">
                🤝
            </div>

            <div>

                <h2 id="personName">
                    Connection
                </h2>

                <div class="online">
                    🟢 Connected
                </div>

            </div>

        </div>


        <!-- CALL BUTTONS -->

        <div class="call-buttons">

            <button
                class="call-btn"
                id="audioCallButton"
                onclick="startCall(false)"
            >
                🎤 Audio
            </button>

            <button
                class="call-btn video-btn"
                id="videoCallButton"
                onclick="startCall(true)"
            >
                📹 Video
            </button>

        </div>

    </div>


    <div class="chat">

        <div class="chat-header">

            <h3>
                💬 Messages
            </h3>

            <p id="skillName">
                Skill Exchange
            </p>

        </div>


        <div
            class="messages"
            id="messages"
        >

            <div class="empty">
                🔄 Loading messages...
            </div>

        </div>


        <div class="input-area">

            <button
                id="emojiButton"
                type="button"
                onclick="addEmoji()"
            >
                😊
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button
                class="send"
                id="sendButton"
                type="button"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- CALL WINDOW -->

<div
    class="call-modal"
    id="callModal"
>

    <div class="call-box">

        <div class="call-title">

            <h2 id="callTitle">
                📞 Calling...
            </h2>

        </div>


        <div class="video-area">

            <video
                id="remoteVideo"
                autoplay
                playsinline
            ></video>


            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>


            <div
                class="audio-placeholder"
                id="audioPlaceholder"
            >

                🎤

                <p>
                    Audio Call
                </p>

            </div>

        </div>


        <div class="call-controls">

            <button
                class="mute-btn"
                id="muteButton"
                onclick="toggleMute()"
            >
                🎤 Mute
            </button>

            <button
                class="end-call"
                onclick="endCall()"
            >
                ☎ End Call
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   BACKEND
===================================================== */

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


/* =====================================================
   USER
===================================================== */

let currentUser = null;

let peerConnection = null;

let localStream = null;

let isVideoCall = false;

let callId = null;

let signalTimer = null;


/* =====================================================
   GET USER
===================================================== */

function getCurrentUser(){

    try{

        const profile =
            JSON.parse(
                localStorage.getItem("userProfile")
                || "null"
            );

        if(profile && profile.id){
            return profile;
        }

        const user =
            JSON.parse(
                localStorage.getItem("user")
                || "null"
            );

        if(user && user.id){
            return user;
        }

        return null;

    }
    catch(error){

        return null;

    }

}


function getActiveChatId(){

    return localStorage.getItem(
        "activeChatId"
    ) || "";

}


function getActiveChatName(){

    return localStorage.getItem(
        "activeChatName"
    ) || "Connection";

}


function getActiveChatSkill(){

    return localStorage.getItem(
        "activeChatSkill"
    ) || "Skill Exchange";

}


/* =====================================================
   INITIALIZE
===================================================== */

function initializeChat(){

    currentUser =
        getCurrentUser();

    const activeChatId =
        getActiveChatId();

    if(!currentUser || !currentUser.id){

        alert("Please login again.");

        window.location.href =
            "index.html";

        return;

    }

    if(!activeChatId){

        alert("Chat user not selected.");

        window.location.href =
            "connections.html";

        return;

    }

    if(
        Number(currentUser.id) ===
        Number(activeChatId)
    ){

        alert("You cannot chat with yourself.");

        window.location.href =
            "connections.html";

        return;

    }

    document.getElementById(
        "personName"
    ).textContent =
        getActiveChatName();

    document.getElementById(
        "skillName"
    ).textContent =
        "Skill: " +
        getActiveChatSkill();

    loadMessages();

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(!currentUser) return;

    const activeChatId =
        getActiveChatId();

    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/messages/" +
                currentUser.id +
                "/" +
                activeChatId
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load messages."
            );

        }

        const box =
            document.getElementById(
                "messages"
            );

        box.innerHTML = "";

        const messages =
            Array.isArray(data.messages)
            ? data.messages
            : [];

        if(messages.length === 0){

            box.innerHTML = `
                <div class="empty">
                    💬 No messages yet.<br>
                    Start the conversation!
                </div>
            `;

            return;

        }

        messages.forEach(
            displayMessage
        );

        box.scrollTop =
            box.scrollHeight;

    }
    catch(error){

        console.error(error);

    }

}


/* =====================================================
   DISPLAY MESSAGE
===================================================== */

function displayMessage(message){

    const box =
        document.getElementById(
            "messages"
        );

    const div =
        document.createElement(
            "div"
        );

    const isMine =
        Number(message.sender_id) ===
        Number(currentUser.id);

    div.className =
        isMine
        ? "message sent"
        : "message received";

    div.innerHTML = `

        ${escapeHTML(
            message.message || ""
        )}

        <span class="time">

            ${escapeHTML(
                formatDate(
                    message.created_at
                )
            )}

        </span>
    `;

    box.appendChild(div);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );

    const text =
        input.value.trim();

    const receiverId =
        getActiveChatId();

    if(!text) return;

    button.disabled = true;

    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/messages",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        sender_id:
                            Number(
                                currentUser.id
                            ),

                        receiver_id:
                            Number(
                                receiverId
                            ),

                        message:text

                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Message failed."
            );

        }

        input.value = "";

        await loadMessages();

    }
    catch(error){

        showError(
            error.message
        );

    }
    finally{

        button.disabled = false;

        input.focus();

    }

}


/* =====================================================
   ENTER
===================================================== */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   EMOJI
===================================================== */

function addEmoji(){

    const input =
        document.getElementById(
            "messageInput"
        );

    input.value += " 😊";

    input.focus();

}


/* =====================================================
   WEBRTC
===================================================== */

const rtcConfig = {

    iceServers:[
        {
            urls:
            "stun:stun.l.google.com:19302"
        },
        {
            urls:
            "stun:stun1.l.google.com:19302"
        }
    ]

};


/* =====================================================
   START CALL
===================================================== */

async function startCall(video){

    isVideoCall =
        video;

    const receiverId =
        getActiveChatId();

    if(!receiverId){

        showError(
            "Connection not selected."
        );

        return;

    }

    try{

        localStream =
            await navigator.mediaDevices.getUserMedia({

                audio:true,

                video:
                    video

            });


        openCallWindow(
            "📞 Calling " +
            getActiveChatName()
        );


        peerConnection =
            createPeerConnection();


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        const offer =
            await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
            offer
        );


        const response =
            await fetch(
                BACKEND_URL +
                "/api/calls",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        caller_id:
                            Number(
                                currentUser.id
                            ),

                        receiver_id:
                            Number(
                                receiverId
                            ),

                        type:
                            video
                            ? "video"
                            : "audio",

                        offer:
                            offer.sdp

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to start call."
            );

        }


        callId =
            data.call_id;


        startSignalPolling();

    }
    catch(error){

        console.error(
            "CALL ERROR:",
            error
        );

        showError(
            error.message
        );

        endCall();

    }

}


/* =====================================================
   CREATE PEER
===================================================== */

function createPeerConnection(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    pc.onicecandidate =
        async function(event){

            if(
                event.candidate &&
                callId
            ){

                await sendSignal({

                    type:"candidate",

                    candidate:
                        event.candidate

                });

            }

        };


    pc.ontrack =
        function(event){

            const remoteVideo =
                document.getElementById(
                    "remoteVideo"
                );

            remoteVideo.srcObject =
                event.streams[0];

        };


    pc.onconnectionstatechange =
        function(){

            console.log(
                "WebRTC:",
                pc.connectionState
            );

            if(
                pc.connectionState ===
                "connected"
            ){

                document.getElementById(
                    "callTitle"
                ).textContent =
                    "🟢 Connected";

            }

        };


    return pc;

}


/* =====================================================
   SEND SIGNAL
===================================================== */

async function sendSignal(signal){

    if(!callId) return;

    try{

        await fetch(
            BACKEND_URL +
            "/api/calls/" +
            callId +
            "/signal",
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    user_id:
                        Number(
                            currentUser.id
                        ),

                    signal:
                        signal

                })

            }
        );

    }
    catch(error){

        console.error(
            "SIGNAL ERROR:",
            error
        );

    }

}


/* =====================================================
   POLL SIGNAL
===================================================== */

function startSignalPolling(){

    if(signalTimer){

        clearInterval(
            signalTimer
        );

    }

    signalTimer =
        setInterval(
            checkSignals,
            1000
        );

}


async function checkSignals(){

    if(!callId) return;

    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/calls/" +
                callId +
                "/signal/" +
                currentUser.id
            );

        const data =
            await response.json();

        if(!response.ok) return;

        const signals =
            data.signals || [];


        for(
            const signal of signals
        ){

            await handleSignal(
                signal
            );

        }

    }
    catch(error){

        console.error(
            "POLL ERROR:",
            error
        );

    }

}


/* =====================================================
   HANDLE SIGNAL
===================================================== */

async function handleSignal(signal){

    if(!peerConnection)
        return;


    if(
        signal.type ===
        "answer"
    ){

        await peerConnection.setRemoteDescription({

            type:"answer",

            sdp:
                signal.sdp

        });

        return;

    }


    if(
        signal.type ===
        "offer"
    ){

        await peerConnection.setRemoteDescription({

            type:"offer",

            sdp:
                signal.sdp

        });


        const answer =
            await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        await sendSignal({

            type:"answer",

            sdp:
                answer.sdp

        });


        return;

    }


    if(
        signal.type ===
        "candidate"
    ){

        try{

            await peerConnection.addIceCandidate(

                new RTCIceCandidate(
                    signal.candidate
                )

            );

        }
        catch(error){

            console.error(
                "ICE ERROR:",
                error
            );

        }

    }

}


/* =====================================================
   CALL WINDOW
===================================================== */

function openCallWindow(title){

    document.getElementById(
        "callModal"
    ).style.display =
        "flex";

    document.getElementById(
        "callTitle"
    ).textContent =
        title;


    document.getElementById(
        "localVideo"
    ).srcObject =
        localStream;


    const localVideo =
        document.getElementById(
            "localVideo"
        );

    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );

    const audioPlaceholder =
        document.getElementById(
            "audioPlaceholder"
        );


    if(isVideoCall){

        localVideo.style.display =
            "block";

        remoteVideo.style.display =
            "block";

        audioPlaceholder.style.display =
            "none";

    }
    else{

        localVideo.style.display =
            "none";

        remoteVideo.style.display =
            "none";

        audioPlaceholder.style.display =
            "flex";

    }

}


/* =====================================================
   MUTE
===================================================== */

function toggleMute(){

    if(!localStream)
        return;

    const audioTracks =
        localStream.getAudioTracks();

    if(!audioTracks.length)
        return;

    audioTracks[0].enabled =
        !audioTracks[0].enabled;


    document.getElementById(
        "muteButton"
    ).textContent =
        audioTracks[0].enabled
        ? "🎤 Mute"
        : "🔇 Unmute";

}


/* =====================================================
   END CALL
===================================================== */

function endCall(){

    if(signalTimer){

        clearInterval(
            signalTimer
        );

        signalTimer =
            null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;

    }


    if(peerConnection){

        peerConnection.close();

        peerConnection = null;

    }


    document.getElementById(
        "localVideo"
    ).srcObject =
        null;

    document.getElementById(
        "remoteVideo"
    ).srcObject =
        null;


    document.getElementById(
        "callModal"
    ).style.display =
        "none";


    callId =
        null;

}


/* =====================================================
   HELPERS
===================================================== */

function formatDate(value){

    if(!value)
        return "";

    try{

        return new Date(
            value
        ).toLocaleString();

    }
    catch(error){

        return String(value);

    }

}


function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;

}


function showError(text){

    const box =
        document.getElementById(
            "error"
        );

    box.textContent =
        "❌ " + text;

    box.style.display =
        "block";

    setTimeout(
        () => {
            box.style.display =
                "none";
        },
        4000
    );

}


/* =====================================================
   START
===================================================== */

setInterval(
    loadMessages,
    3000
);


document.addEventListener(
    "DOMContentLoaded",
    initializeChat
);
