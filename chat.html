<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:
    radial-gradient(circle at top right,#3b2470,transparent 35%),
    linear-gradient(135deg,#080812,#15132b);
}

nav{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(10,10,20,.85);
    border-bottom:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    padding:9px 14px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;
}

.container{
    width:92%;
    max-width:850px;
    margin:20px auto;
}

.profile{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    border-radius:18px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    margin-bottom:12px;
}

.avatar,
.call-avatar{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,#8066ff,#bd82ff);
}

.avatar{
    width:55px;
    height:55px;
    font-size:26px;
}

.profile h2{
    margin-bottom:4px;
}

.online{
    color:#62e27c;
    font-size:13px;
}

.call-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
}

.call{
    padding:15px;
    border:none;
    border-radius:14px;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.video{
    background:linear-gradient(135deg,#8066ff,#bd82ff);
}

.audio{
    background:linear-gradient(135deg,#347cff,#5b69ff);
}

.chat{
    height:610px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
}

.chat-header{
    padding:15px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.chat-header h3{
    margin-bottom:4px;
}

.chat-header p{
    color:#999;
    font-size:12px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:75%;
    padding:11px 14px;
    border-radius:16px;
    line-height:1.4;
    font-size:14px;
    word-wrap:break-word;
}

.received{
    align-self:flex-start;
    background:rgba(255,255,255,.1);
    border-bottom-left-radius:4px;
}

.sent{
    align-self:flex-end;
    background:linear-gradient(135deg,#8066ff,#bd82ff);
    border-bottom-right-radius:4px;
}

.time{
    display:block;
    text-align:right;
    font-size:9px;
    opacity:.6;
    margin-top:4px;
}

.input-area{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px;
    background:rgba(8,8,18,.9);
    border-top:1px solid rgba(255,255,255,.08);
}

.input-area button{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:white;
    cursor:pointer;
    font-size:17px;
}

.input-area input{
    flex:1;
    padding:13px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:14px;
}

.input-area input::placeholder{
    color:#888;
}

.send{
    background:linear-gradient(135deg,#8066ff,#bd82ff)!important;
}


/* CALL SCREEN */

.call-screen{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(3,3,10,.97);
    z-index:9999;
}

.call-box{
    width:92%;
    max-width:500px;
    padding:25px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
}

.call-avatar{
    width:90px;
    height:90px;
    margin:0 auto 18px;
    font-size:40px;
}

.call-box h2{
    margin-bottom:8px;
}

.call-status{
    color:#aaa;
    margin-bottom:20px;
}

video{
    background:#000;
    border-radius:18px;
}

#localVideo{
    display:none;
    width:100%;
    max-height:300px;
    object-fit:cover;
}

#remoteVideo{
    display:none;
    width:100%;
    max-height:400px;
    object-fit:cover;
    margin-bottom:15px;
}

.call-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

.call-action{
    padding:12px 22px;
    border:none;
    border-radius:25px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.accept{
    background:#28a745;
}

.reject,
.end-call{
    background:#e74c3c;
}

@media(max-width:600px){

    .container{
        width:96%;
    }

    .chat{
        height:600px;
    }

    .message{
        max-width:85%;
    }

    .logo{
        font-size:17px;
    }

}

</style>
</head>


<body>


<nav>

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a href="connections.html" class="back">
        ← Connections
    </a>

</nav>


<div class="container">


    <div class="profile">

        <div class="avatar">
            🤝
        </div>

        <div>

            <h2 id="personName">
                Connection
            </h2>

            <div class="online">
                🟢 Connected
            </div>

        </div>

    </div>


    <div class="call-buttons">

        <button
            class="call video"
            onclick="startCall('video')"
        >
            🎥 Video Call
        </button>

        <button
            class="call audio"
            onclick="startCall('audio')"
        >
            🎤 Audio Call
        </button>

    </div>


    <div class="chat">

        <div class="chat-header">

            <h3>
                💬 Messages
            </h3>

            <p id="skillName">
                Skill Exchange
            </p>

        </div>


        <div
            class="messages"
            id="messages"
        ></div>


        <div class="input-area">

            <button onclick="addEmoji()">
                😊
            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                onkeydown="handleKey(event)"
            >

            <button
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- CALL SCREEN -->

<div
    class="call-screen"
    id="callScreen"
>

    <div class="call-box">

        <div class="call-avatar">
            🤝
        </div>

        <h2 id="callName">
            Connection
        </h2>

        <p
            class="call-status"
            id="callStatus"
        >
            Calling...
        </p>


        <video
            id="remoteVideo"
            autoplay
            playsinline
        ></video>


        <video
            id="localVideo"
            autoplay
            muted
            playsinline
        ></video>


        <div
            class="call-actions"
            id="incomingActions"
            style="display:none;"
        >

            <button
                class="call-action accept"
                onclick="acceptIncomingCall()"
            >
                ✅ Accept
            </button>

            <button
                class="call-action reject"
                onclick="rejectIncomingCall()"
            >
                ❌ Reject
            </button>

        </div>


        <div
            class="call-actions"
            id="activeCallActions"
            style="display:none;"
        >

            <button
                class="call-action end-call"
                onclick="endCall()"
            >
                📵 End Call
            </button>

        </div>

    </div>

</div>


<script>


// ======================================================
// BACKEND
// ======================================================

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


// ======================================================
// CURRENT USER
// ======================================================

let currentUser = null;

try{

    currentUser =
        JSON.parse(
            localStorage.getItem("userProfile") || "null"
        );

}
catch(error){

    currentUser = null;

}


if(
    !currentUser ||
    !currentUser.id
){

    alert("Please login again.");

    window.location.href =
        "index.html";

}


// ======================================================
// ACTIVE CHAT USER
// ======================================================

const activeChatId =
    localStorage.getItem("activeChatId");

const personName =
    localStorage.getItem("activeChatName")
    || "Connection";

const skillName =
    localStorage.getItem("activeChatSkill")
    || "Skill Exchange";


if(!activeChatId){

    alert("Chat user not selected.");

    window.location.href =
        "connections.html";

}


document.getElementById("personName")
.textContent = personName;

document.getElementById("skillName")
.textContent = "Skill: " + skillName;

document.getElementById("callName")
.textContent = personName;


// ======================================================
// MESSAGES
// ======================================================

async function loadMessages(){

    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/messages/" +
                currentUser.id +
                "/" +
                activeChatId
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load messages."
            );

        }

        const box =
            document.getElementById("messages");

        box.innerHTML = "";

        (data.messages || []).forEach(
            message => {

                const div =
                    document.createElement("div");

                div.className =
                    Number(message.senderId)
                    === Number(currentUser.id)
                    ? "message sent"
                    : "message received";

                div.innerHTML =
                    escapeHTML(message.message) +
                    `<span class="time">
                        ${escapeHTML(
                            message.createdAt || ""
                        )}
                    </span>`;

                box.appendChild(div);

            }
        );

        box.scrollTop =
            box.scrollHeight;

    }
    catch(error){

        console.error(
            "Load messages:",
            error
        );

    }

}


// ======================================================
// SEND MESSAGE
// ======================================================

async function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;

    input.disabled = true;

    try{

        const response =
            await fetch(
                BACKEND_URL + "/api/messages",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        senderId:
                            currentUser.id,

                        receiverId:
                            Number(activeChatId),

                        message:
                            text

                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Message failed."
            );

        }

        input.value = "";

        await loadMessages();

    }
    catch(error){

        alert("❌ " + error.message);

    }
    finally{

        input.disabled = false;
        input.focus();

    }

}


function handleKey(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}


function addEmoji(){

    const input =
        document.getElementById("messageInput");

    input.value += " 😊";

    input.focus();

}


function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


setInterval(
    loadMessages,
    2000
);


// ======================================================
// WEBRTC
// ======================================================

let peerConnection = null;

let localStream = null;

let currentCallId = null;

let incomingCall = null;

let currentCallType = "video";


const rtcConfig = {

    iceServers:[
        {
            urls:
            "stun:stun.l.google.com:19302"
        },
        {
            urls:
            "stun:stun1.l.google.com:19302"
        }
    ]

};


// ======================================================
// CREATE PEER CONNECTION
// ======================================================

function createPeerConnection(){

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    peerConnection.ontrack =
        function(event){

            const remoteVideo =
                document.getElementById(
                    "remoteVideo"
                );

            remoteVideo.srcObject =
                event.streams[0];

            remoteVideo.style.display =
                "block";

        };


    peerConnection.onicecandidate =
        async function(event){

            if(
                !event.candidate ||
                !currentCallId
            ){

                return;

            }

            try{

                await fetch(
                    BACKEND_URL +
                    "/api/calls/" +
                    currentCallId +
                    "/candidate",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            userId:
                                currentUser.id,

                            candidate:
                                event.candidate

                        })

                    }
                );

            }
            catch(error){

                console.error(
                    "ICE candidate error:",
                    error
                );

            }

        };

    return peerConnection;

}


// ======================================================
// START CALL
// ======================================================

async function startCall(type){

    currentCallType = type;

    const screen =
        document.getElementById(
            "callScreen"
        );

    const status =
        document.getElementById(
            "callStatus"
        );

    const localVideo =
        document.getElementById(
            "localVideo"
        );

    screen.style.display =
        "flex";

    document.getElementById(
        "incomingActions"
    ).style.display =
        "none";

    document.getElementById(
        "activeCallActions"
    ).style.display =
        "flex";

    status.textContent =
        "📞 Calling " + personName + "...";


    try{

        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:
                    type === "video",

                audio:true

            });


        localStream
        .getTracks()
        .forEach(
            track => {

                if(!peerConnection){

                    createPeerConnection();

                }

                peerConnection.addTrack(
                    track,
                    localStream
                );

            }
        );


        if(type === "video"){

            localVideo.srcObject =
                localStream;

            localVideo.style.display =
                "block";

        }


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
        .setLocalDescription(
            offer
        );


        const response =
            await fetch(
                BACKEND_URL +
                "/api/calls",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        callerId:
                            currentUser.id,

                        receiverId:
                            Number(activeChatId),

                        type:type,

                        offer:offer

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not create call."
            );

        }


        currentCallId =
            data.callId;


        status.textContent =
            "📞 Ringing...";

        pollCallStatus();

    }
    catch(error){

        console.error(
            "Start call error:",
            error
        );

        status.textContent =
            "❌ " + error.message;

        stopMedia();

    }

}


// ======================================================
// CHECK INCOMING CALL
// ======================================================

async function checkIncomingCalls(){

    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/calls/incoming/" +
                currentUser.id
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.calls ||
            !data.calls.length
        ){

            return;

        }


        const call =
            data.calls[0];


        if(
            currentCallId ||
            incomingCall
        ){

            return;

        }


        incomingCall =
            call;

        currentCallId =
            call.callId;

        currentCallType =
            call.type;


        document.getElementById(
            "callScreen"
        ).style.display =
            "flex";


        document.getElementById(
            "callName"
        ).textContent =
            personName;


        document.getElementById(
            "callStatus"
        ).textContent =
            "📞 Incoming " +
            call.type +
            " call";


        document.getElementById(
            "incomingActions"
        ).style.display =
            "flex";


        document.getElementById(
            "activeCallActions"
        ).style.display =
            "none";

    }
    catch(error){

        console.error(
            "Incoming call error:",
            error
        );

    }

}


setInterval(
    checkIncomingCalls,
    2000
);


// ======================================================
// ACCEPT CALL
// ======================================================

async function acceptIncomingCall(){

    if(!incomingCall){

        return;

    }


    try{

        document.getElementById(
            "incomingActions"
        ).style.display =
            "none";


        document.getElementById(
            "activeCallActions"
        ).style.display =
            "flex";


        document.getElementById(
            "callStatus"
        ).textContent =
            "🔗 Connecting...";


        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:
                    currentCallType === "video",

                audio:true

            });


        createPeerConnection();


        localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            }
        );


        const localVideo =
            document.getElementById(
                "localVideo"
            );


        if(currentCallType === "video"){

            localVideo.srcObject =
                localStream;

            localVideo.style.display =
                "block";

        }


        await peerConnection
        .setRemoteDescription(
            new RTCSessionDescription(
                incomingCall.offer
            )
        );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
        .setLocalDescription(
            answer
        );


        const response =
            await fetch(
                BACKEND_URL +
                "/api/calls/" +
                currentCallId +
                "/answer",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        userId:
                            currentUser.id,

                        answer:answer

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not accept call."
            );

        }


        incomingCall = null;


        document.getElementById(
            "callStatus"
        ).textContent =
            "🟢 Connected";

    }
    catch(error){

        console.error(
            "Accept call error:",
            error
        );

        alert(
            "❌ " + error.message
        );

        endCall();

    }

}


// ======================================================
// REJECT CALL
// ======================================================

async function rejectIncomingCall(){

    if(!currentCallId){

        closeCallScreen();

        return;

    }


    try{

        await fetch(
            BACKEND_URL +
            "/api/calls/" +
            currentCallId +
            "/reject",
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    userId:
                        currentUser.id

                })

            }
        );

    }
    catch(error){

        console.error(
            error
        );

    }


    incomingCall = null;

    currentCallId = null;

    closeCallScreen();

}


// ======================================================
// POLL CALL STATUS
// ======================================================

async function pollCallStatus(){

    const timer =
        setInterval(
            async function(){

                if(!currentCallId){

                    clearInterval(timer);

                    return;

                }


                try{

                    const response =
                        await fetch(
                            BACKEND_URL +
                            "/api/calls/" +
                            currentCallId
                        );


                    const data =
                        await response.json();


                    if(!response.ok){

                        return;

                    }


                    const call =
                        data.call;


                    if(!call){

                        return;

                    }


                    if(
                        call.status ===
                        "rejected"
                    ){

                        clearInterval(timer);

                        document.getElementById(
                            "callStatus"
                        ).textContent =
                            "❌ Call rejected.";

                        setTimeout(
                            closeCallScreen,
                            1200
                        );

                        return;

                    }


                    if(
                        call.status ===
                        "ended"
                    ){

                        clearInterval(timer);

                        closeCallScreen();

                        return;

                    }


                    if(
                        call.answer &&
                        peerConnection &&
                        peerConnection
                        .signalingState
                        ===
                        "have-local-offer"
                    ){

                        await peerConnection
                        .setRemoteDescription(
                            new RTCSessionDescription(
                                call.answer
                            )
                        );


                        document.getElementById(
                            "callStatus"
                        ).textContent =
                            "🟢 Connected";

                        clearInterval(timer);

                        pollCandidates();

                    }

                }
                catch(error){

                    console.error(
                        "Call status error:",
                        error
                    );

                }

            },
            1500
        );

}


// ======================================================
// ICE CANDIDATES
// ======================================================

async function pollCandidates(){

    if(!currentCallId){

        return;

    }


    setInterval(
        async function(){

            try{

                const response =
                    await fetch(
                        BACKEND_URL +
                        "/api/calls/" +
                        currentCallId +
                        "/candidates/" +
                        currentUser.id
                    );


                if(!response.ok){

                    return;

                }


                const data =
                    await response.json();


                for(
                    const candidate
                    of
                    (data.candidates || [])
                ){

                    try{

                        await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                    }
                    catch(error){

                        console.error(
                            "Add ICE error:",
                            error
                        );

                    }

                }

            }
            catch(error){

                console.error(
                    "Candidate polling:",
                    error
                );

            }

        },
        1000
    );

}


// ======================================================
// END CALL
// ======================================================

async function endCall(){

    const callId =
        currentCallId;


    if(callId){

        try{

            await fetch(
                BACKEND_URL +
                "/api/calls/" +
                callId +
                "/end",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        userId:
                            currentUser.id

                    })

                }
            );

        }
        catch(error){

            console.error(
                "End call error:",
                error
            );

        }

    }


    stopMedia();


    if(peerConnection){

        peerConnection.close();

        peerConnection = null;

    }


    currentCallId = null;

    incomingCall = null;


    closeCallScreen();

}


// ======================================================
// STOP MEDIA
// ======================================================

function stopMedia(){

    if(localStream){

        localStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

        localStream = null;

    }


    const localVideo =
        document.getElementById(
            "localVideo"
        );

    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );


    localVideo.srcObject = null;

    remoteVideo.srcObject = null;

    localVideo.style.display = "none";

    remoteVideo.style.display = "none";

}


// ======================================================
// CLOSE CALL SCREEN
// ======================================================

function closeCallScreen(){

    document.getElementById(
        "callScreen"
    ).style.display =
        "none";

    document.getElementById(
        "incomingActions"
    ).style.display =
        "none";

    document.getElementById(
        "activeCallActions"
    ).style.display =
        "none";

}


// ======================================================
// FIRST LOAD
// ======================================================

loadMessages();

checkIncomingCalls();

</script>
