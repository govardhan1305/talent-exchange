<title>Connect | Talent Exchange</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    color:white;

    background:
    radial-gradient(
        circle at top right,
        #3b2470,
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #080812,
        #15132b
    );

}


/* NAVIGATION */

nav{

    height:75px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 7%;

    background:rgba(10,10,20,.75);

    border-bottom:
    1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);

}

.logo{

    font-size:22px;

    font-weight:bold;

}

.back{

    color:white;

    text-decoration:none;

    padding:10px 16px;

    border:
    1px solid rgba(255,255,255,.2);

    border-radius:10px;

}


/* MAIN */

.container{

    width:92%;

    max-width:850px;

    margin:25px auto;

}


/* PROFILE HEADER */

.profile{

    display:flex;

    align-items:center;

    gap:15px;

    padding:20px;

    border-radius:20px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.1);

    margin-bottom:18px;

}

.avatar{

    width:55px;

    height:55px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

    font-size:25px;

}

.profile h2{

    margin-bottom:5px;

}

.profile p{

    color:#aaa;

    font-size:14px;

}


/* CALL BUTTONS */

.call-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

    margin-bottom:18px;

}

.call{

    padding:18px;

    border:none;

    border-radius:16px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

.call:hover{

    transform:translateY(-3px);

}

.video{

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

}

.audio{

    background:
    linear-gradient(
        135deg,
        #3b9cff,
        #5c6cff
    );

}


/* CHAT */

.chat{

    height:600px;

    display:flex;

    flex-direction:column;

    border-radius:22px;

    overflow:hidden;

    background:
    rgba(255,255,255,.06);

    border:
    1px solid rgba(255,255,255,.1);

}

.chat-title{

    padding:18px 20px;

    background:
    rgba(255,255,255,.05);

    border-bottom:
    1px solid rgba(255,255,255,.08);

}

.chat-title h3{

    margin-bottom:4px;

}

.chat-title p{

    color:#aaa;

    font-size:13px;

}


/* MESSAGES */

.messages{

    flex:1;

    padding:20px;

    overflow-y:auto;

    display:flex;

    flex-direction:column;

    gap:12px;

}

.message{

    max-width:75%;

    padding:12px 15px;

    border-radius:16px;

    line-height:1.4;

    word-wrap:break-word;

}

.received{

    align-self:flex-start;

    background:
    rgba(255,255,255,.1);

}

.sent{

    align-self:flex-end;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

}

.time{

    display:block;

    margin-top:4px;

    font-size:10px;

    opacity:.65;

}


/* INPUT */

.input-area{

    display:flex;

    gap:10px;

    padding:15px;

    background:
    rgba(10,10,20,.8);

}

.input-area input{

    flex:1;

    padding:14px;

    border:none;

    outline:none;

    border-radius:12px;

    background:
    rgba(255,255,255,.1);

    color:white;

    font-size:15px;

}

.input-area input::placeholder{

    color:#999;

}

.input-area button{

    padding:0 20px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        90deg,
        #8066ff,
        #bd82ff
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

}


/* CALL POPUP */

.call-screen{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:
    rgba(5,5,15,.96);

    z-index:999;

}

.call-box{

    width:90%;

    max-width:450px;

    text-align:center;

    padding:35px;

    border-radius:25px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.15);

}

.call-avatar{

    width:90px;

    height:90px;

    margin:0 auto 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

    font-size:40px;

}

.call-box h2{

    margin-bottom:8px;

}

.call-status{

    color:#aaa;

    margin-bottom:25px;

}

.end-call{

    padding:13px 30px;

    border:none;

    border-radius:30px;

    background:#e74c3c;

    color:white;

    font-weight:bold;

    cursor:pointer;

}


/* MOBILE */

@media(max-width:600px){

    .container{

        width:95%;

    }

    .call-buttons{

        grid-template-columns:1fr;

    }

    .chat{

        height:550px;

    }

    .message{

        max-width:85%;

    }

}

</style></head><body><nav><div class="logo">

    ✨ Talent Exchange

</div>


<a
    href="connections.html"
    class="back"
>

    ← Connections

</a>

</nav><div class="container"><!-- CONNECTION -->

<div class="profile">

    <div class="avatar">

        🤝

    </div>


    <div>

        <h2 id="chatName">

            Connection

        </h2>


        <p id="chatSkill">

            Skill Exchange

        </p>

    </div>

</div>


<!-- CALL BUTTONS -->

<div class="call-buttons">


    <button
        class="call video"
        onclick="startCall('video')"
    >

        🎥 Video Call

    </button>


    <button
        class="call audio"
        onclick="startCall('audio')"
    >

        📞 Audio Call

    </button>


</div>


<!-- CHAT -->

<div class="chat">


    <div class="chat-title">

        <h3>
            💬 Chat
        </h3>

        <p>
            Exchange messages and learn together.
        </p>

    </div>


    <div
        class="messages"
        id="messages"
    ></div>


    <div class="input-area">


        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            onkeydown="handleKey(event)"
        >


        <button
            onclick="sendMessage()"
        >

            Send

        </button>


    </div>

</div>

</div><!-- CALL SCREEN --><div
    class="call-screen"
    id="callScreen"
><div class="call-box">


    <div class="call-avatar">

        🤝

    </div>


    <h2 id="callName">

        Connection

    </h2>


    <p
        class="call-status"
        id="callStatus"
    >

        Calling...

    </p>


    <button
        class="end-call"
        onclick="endCall()"
    >

        📵 End Call

    </button>


</div>

</div><script>


/* CONNECTION INFO */

const chatName =

    localStorage.getItem(
        "activeChatName"
    )
    || "Connection";


const chatSkill =

    localStorage.getItem(
        "activeChatSkill"
    )
    || "Skill Exchange";


document
    .getElementById("chatName")
    .textContent = chatName;


document
    .getElementById("chatSkill")
    .textContent =
        "Can teach: " + chatSkill;


/* CHAT STORAGE */

const chatKey =

    "chat_" +
    chatName
    .replace(/\s+/g,"_");


let messages =

    JSON.parse(
        localStorage.getItem(chatKey)
        || "[]"
    );


/* DISPLAY */

function displayMessages(){

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    messages.forEach(message => {

        container.innerHTML += `

            <div
                class="message ${message.type}"
            >

                ${escapeHTML(message.text)}

                <span class="time">

                    ${message.time}

                </span>

            </div>

        `;

    });


    container.scrollTop =
        container.scrollHeight;

}


/* SEND */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    messages.push({

        text:text,

        type:"sent",

        time:
        new Date()
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    });


    localStorage.setItem(

        chatKey,

        JSON.stringify(messages)

    );


    input.value = "";


    displayMessages();

}


/* ENTER */

function handleKey(event){

    if(event.key === "Enter"){

        sendMessage();

    }

}


/* SECURITY */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* CALL */

function startCall(type){

    const screen =
        document.getElementById(
            "callScreen"
        );


    const name =
        document.getElementById(
            "callName"
        );


    const status =
        document.getElementById(
            "callStatus"
        );


    name.textContent =
        chatName;


    if(type === "video"){

        status.textContent =
            "🎥 Starting video call...";

    }else{

        status.textContent =
            "📞 Starting audio call...";

    }


    screen.style.display =
        "flex";

}


/* END CALL */

function endCall(){

    document.getElementById(
        "callScreen"
    ).style.display =
        "none";

}


/* LOAD */

displayMessages();


</script></body></html>
