<title>Chat | Talent Exchange</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    color:white;

    background:
    radial-gradient(
        circle at top right,
        #3b2470,
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #080812,
        #15132b
    );

}


/* NAVBAR */

nav{

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 6%;

    background:
    rgba(10,10,20,.85);

    border-bottom:
    1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);

}

.logo{

    font-size:21px;

    font-weight:bold;

}

.back{

    color:white;

    text-decoration:none;

    padding:9px 14px;

    border:
    1px solid rgba(255,255,255,.2);

    border-radius:10px;

}


/* MAIN */

.container{

    width:92%;

    max-width:850px;

    margin:20px auto;

}


/* PROFILE */

.profile{

    display:flex;

    align-items:center;

    gap:14px;

    padding:16px 18px;

    border-radius:18px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.1);

    margin-bottom:12px;

}

.avatar{

    width:55px;
    height:55px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

    font-size:26px;

}

.profile h2{

    margin-bottom:4px;

}

.online{

    color:#62e27c;

    font-size:13px;

}


/* CALL BUTTONS */

.call-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:12px;

}

.call{

    padding:14px;

    border:none;

    border-radius:14px;

    color:white;

    font-weight:bold;

    font-size:15px;

    cursor:pointer;

    transition:.3s;

}

.call:hover{

    transform:translateY(-2px);

}

.video{

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

}

.audio{

    background:
    linear-gradient(
        135deg,
        #347cff,
        #5b69ff
    );

}


/* CHAT BOX */

.chat{

    height:610px;

    display:flex;

    flex-direction:column;

    overflow:hidden;

    border-radius:20px;

    background:
    rgba(255,255,255,.055);

    border:
    1px solid rgba(255,255,255,.1);

}


/* CHAT HEADER */

.chat-header{

    padding:15px 18px;

    border-bottom:
    1px solid rgba(255,255,255,.08);

}

.chat-header h3{

    margin-bottom:4px;

}

.chat-header p{

    color:#999;

    font-size:12px;

}


/* MESSAGES */

.messages{

    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;

    flex-direction:column;

    gap:12px;

}

.message{

    max-width:75%;

    padding:11px 14px;

    border-radius:16px;

    line-height:1.4;

    font-size:14px;

    word-wrap:break-word;

}

.received{

    align-self:flex-start;

    background:
    rgba(255,255,255,.1);

    border-bottom-left-radius:4px;

}

.sent{

    align-self:flex-end;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

    border-bottom-right-radius:4px;

}

.time{

    display:block;

    text-align:right;

    font-size:9px;

    opacity:.6;

    margin-top:4px;

}


/* TYPING */

.typing{

    display:none;

    padding:
    0 20px 10px;

    color:#aaa;

    font-size:12px;

}


/* INPUT */

.input-area{

    display:flex;

    align-items:center;

    gap:8px;

    padding:12px;

    background:
    rgba(8,8,18,.9);

    border-top:
    1px solid rgba(255,255,255,.08);

}

.input-area button{

    width:42px;

    height:42px;

    border:none;

    border-radius:50%;

    background:
    rgba(255,255,255,.1);

    color:white;

    cursor:pointer;

    font-size:17px;

}

.input-area input{

    flex:1;

    padding:13px;

    border:none;

    outline:none;

    border-radius:12px;

    background:
    rgba(255,255,255,.1);

    color:white;

}

.input-area input::placeholder{

    color:#888;

}

.send{

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    ) !important;

}


/* CALL SCREEN */

.call-screen{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:
    rgba(3,3,10,.97);

    z-index:999;

}

.call-box{

    width:90%;

    max-width:430px;

    padding:35px;

    text-align:center;

    border-radius:25px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.12);

}

.call-avatar{

    width:90px;
    height:90px;

    margin:
    0 auto 18px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

    font-size:40px;

}

.call-box h2{

    margin-bottom:8px;

}

.call-status{

    color:#aaa;

    margin-bottom:25px;

}

.end-call{

    padding:13px 30px;

    border:none;

    border-radius:30px;

    background:#e74c3c;

    color:white;

    font-weight:bold;

    cursor:pointer;

}


/* MOBILE */

@media(max-width:600px){

    .container{

        width:96%;

    }

    .call-buttons{

        grid-template-columns:1fr 1fr;

    }

    .chat{

        height:600px;

    }

    .message{

        max-width:85%;

    }

    .logo{

        font-size:17px;

    }

}

</style></head><body><nav><div class="logo">

    ✨ Talent Exchange

</div>


<a
    href="connections.html"
    class="back"
>

    ← Connections

</a>

</nav><div class="container"><!-- PROFILE -->

<div class="profile">

    <div class="avatar">

        🤝

    </div>


    <div>

        <h2 id="personName">
            Connection
        </h2>

        <div class="online">
            🟢 Online
        </div>

    </div>

</div>


<!-- CALLS -->

<div class="call-buttons">

    <button
        class="call video"
        onclick="startCall('video')"
    >

        🎥 Video Call

    </button>


    <button
        class="call audio"
        onclick="startCall('audio')"
    >

        📞 Audio Call

    </button>

</div>


<!-- CHAT -->

<div class="chat">


    <div class="chat-header">

        <h3>
            💬 Messages
        </h3>

        <p id="skillName">
            Skill Exchange
        </p>

    </div>


    <div
        class="messages"
        id="messages"
    ></div>


    <div
        class="typing"
        id="typing"
    >

        ✍️ Typing...

    </div>


    <div class="input-area">


        <button
            onclick="addEmoji()"
        >
            😊
        </button>


        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            onkeydown="handleKey(event)"
            oninput="showTyping()"
        >


        <button
            class="send"
            onclick="sendMessage()"
        >

            ➤

        </button>


    </div>

</div>

</div><!-- CALL SCREEN --><div
    class="call-screen"
    id="callScreen"
><div class="call-box">


    <div class="call-avatar">
        🤝
    </div>


    <h2 id="callName">
        Connection
    </h2>


    <p
        class="call-status"
        id="callStatus"
    >
        Calling...
    </p>


    <button
        class="end-call"
        onclick="endCall()"
    >

        📵 End Call

    </button>


</div>

</div><script>


/* CONNECTION */

const personName =

    localStorage.getItem(
        "activeChatName"
    )
    || "Connection";


const skillName =

    localStorage.getItem(
        "activeChatSkill"
    )
    || "Skill Exchange";


document
    .getElementById("personName")
    .textContent =
        personName;


document
    .getElementById("skillName")
    .textContent =
        "Skill: " + skillName;


/* CHAT STORAGE */

const chatKey =

    "chat_" +
    personName.replace(
        /\s+/g,
        "_"
    );


let messages =

    JSON.parse(
        localStorage.getItem(chatKey)
        || "[]"
    );


/* FIRST MESSAGE */

if(messages.length === 0){

    messages.push({

        text:
        "Hey! 👋 Nice to connect with you.",

        type:
        "received",

        time:
        getTime()

    });

    saveMessages();

}


/* DISPLAY */

function displayMessages(){

    const box =
        document.getElementById(
            "messages"
        );


    box.innerHTML = "";


    messages.forEach(message => {

        const div =
            document.createElement("div");


        div.className =
            "message " +
            message.type;


        div.innerHTML =

            escapeHTML(
                message.text
            )

            +

            `<span class="time">
                ${message.time}
            </span>`;


        box.appendChild(div);

    });


    box.scrollTop =
        box.scrollHeight;

}


/* SEND MESSAGE */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(text === ""){

        return;

    }


    messages.push({

        text:text,

        type:"sent",

        time:getTime()

    });


    saveMessages();


    input.value = "";


    displayMessages();


    /* FAKE REPLY */

    setTimeout(() => {

        document
            .getElementById(
                "typing"
            )
            .style.display =
                "block";


    },500);


    setTimeout(() => {

        document
            .getElementById(
                "typing"
            )
            .style.display =
                "none";


        messages.push({

            text:
            "Sounds great! 👍",

            type:
            "received",

            time:
            getTime()

        });


        saveMessages();

        displayMessages();

    },1500);

}


/* ENTER */

function handleKey(event){

    if(event.key === "Enter"){

        sendMessage();

    }

}


/* EMOJI */

function addEmoji(){

    const input =
        document.getElementById(
            "messageInput"
        );


    input.value += " 😊";

    input.focus();

}


/* TYPING */

function showTyping(){

    const input =
        document.getElementById(
            "messageInput"
        );

}


/* SAVE */

function saveMessages(){

    localStorage.setItem(

        chatKey,

        JSON.stringify(messages)

    );

}


/* TIME */

function getTime(){

    return new Date()
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* SECURITY */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* CALL */

function startCall(type){

    document
        .getElementById(
            "callScreen"
        )
        .style.display =
            "flex";


    document
        .getElementById(
            "callName"
        )
        .textContent =
            personName;


    if(type === "video"){

        document
            .getElementById(
                "callStatus"
            )
            .textContent =
                "🎥 Starting video call...";

    }else{

        document
            .getElementById(
                "callStatus"
            )
            .textContent =
                "📞 Starting audio call...";

    }

}


/* END CALL */

function endCall(){

    document
        .getElementById(
            "callScreen"
        )
        .style.display =
            "none";

}


/* LOAD */

displayMessages();

</script></body></html>
