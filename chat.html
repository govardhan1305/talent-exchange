<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;

    background:
    radial-gradient(circle at top right,#3b2470,transparent 35%),
    linear-gradient(135deg,#080812,#15132b);
}

nav{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(10,10,20,.85);

    border-bottom:
    1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;

    padding:9px 14px;

    border:1px solid rgba(255,255,255,.2);

    border-radius:10px;
}

.container{
    width:92%;
    max-width:850px;

    margin:20px auto;
}

.profile{
    display:flex;
    align-items:center;

    gap:14px;

    padding:16px 18px;

    border-radius:18px;

    background:rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.1);

    margin-bottom:12px;
}

.avatar{
    width:55px;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:26px;

    background:
    linear-gradient(135deg,#8066ff,#bd82ff);
}

.profile h2{
    margin-bottom:4px;
}

.online{
    color:#62e27c;
    font-size:13px;
}

.chat{
    height:650px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border-radius:20px;

    background:rgba(255,255,255,.055);

    border:
    1px solid rgba(255,255,255,.1);
}

.chat-header{
    padding:15px 18px;

    border-bottom:
    1px solid rgba(255,255,255,.08);
}

.chat-header h3{
    margin-bottom:4px;
}

.chat-header p{
    color:#999;
    font-size:12px;
}

.messages{
    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.message{
    max-width:75%;

    padding:11px 14px;

    border-radius:16px;

    line-height:1.4;

    font-size:14px;

    word-wrap:break-word;
}

.received{
    align-self:flex-start;

    background:rgba(255,255,255,.1);

    border-bottom-left-radius:4px;
}

.sent{
    align-self:flex-end;

    background:
    linear-gradient(135deg,#8066ff,#bd82ff);

    border-bottom-right-radius:4px;
}

.time{
    display:block;

    text-align:right;

    font-size:9px;

    opacity:.6;

    margin-top:4px;
}

.empty{
    margin:auto;

    text-align:center;

    color:#888;

    padding:30px;
}

.input-area{
    display:flex;
    align-items:center;

    gap:8px;

    padding:12px;

    background:rgba(8,8,18,.9);

    border-top:
    1px solid rgba(255,255,255,.08);
}

.input-area button{
    width:42px;
    height:42px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.1);

    color:white;

    cursor:pointer;

    font-size:17px;
}

.input-area input{
    flex:1;

    padding:13px;

    border:none;

    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.1);

    color:white;

    font-size:14px;
}

.input-area input::placeholder{
    color:#888;
}

.send{
    background:
    linear-gradient(135deg,#8066ff,#bd82ff)!important;
}

.input-area button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.error{
    display:none;

    padding:12px;

    margin-bottom:12px;

    text-align:center;

    border-radius:12px;

    color:#ff9b9b;

    background:rgba(220,60,70,.15);
}

.success{
    display:none;

    padding:12px;

    margin-bottom:12px;

    text-align:center;

    border-radius:12px;

    color:#9be6a5;

    background:rgba(70,200,120,.15);
}

@media(max-width:600px){

    .container{
        width:96%;
    }

    .chat{
        height:600px;
    }

    .message{
        max-width:85%;
    }

    .logo{
        font-size:17px;
    }

}

</style>

</head>


<body>


<nav>

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a
        href="connections.html"
        class="back"
    >
        ← Connections
    </a>

</nav>


<div class="container">


    <div
        id="error"
        class="error"
    ></div>


    <div
        id="success"
        class="success"
    ></div>


    <div class="profile">

        <div class="avatar">
            🤝
        </div>

        <div>

            <h2 id="personName">
                Connection
            </h2>

            <div class="online">
                🟢 Connected
            </div>

        </div>

    </div>


    <div class="chat">


        <div class="chat-header">

            <h3>
                💬 Messages
            </h3>

            <p id="skillName">
                Skill Exchange
            </p>

        </div>


        <div
            class="messages"
            id="messages"
        >

            <div class="empty">
                🔄 Loading messages...
            </div>

        </div>


        <div class="input-area">


            <button
                id="emojiButton"
                type="button"
                onclick="addEmoji()"
            >
                😊
            </button>


            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >


            <button
                class="send"
                id="sendButton"
                type="button"
                onclick="sendMessage()"
            >
                ➤
            </button>


        </div>


    </div>


</div>


<script>


// =====================================================
// BACKEND
// =====================================================

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


// =====================================================
// CURRENT USER
// =====================================================

let currentUser = null;


// =====================================================
// GET CURRENT USER
// =====================================================

function getCurrentUser(){

    try{

        const profile =
            JSON.parse(
                localStorage.getItem(
                    "userProfile"
                ) || "null"
            );

        if(
            profile &&
            profile.id
        ){

            return profile;

        }


        const user =
            JSON.parse(
                localStorage.getItem(
                    "user"
                ) || "null"
            );


        if(
            user &&
            user.id
        ){

            return user;

        }


        return null;

    }
    catch(error){

        console.error(
            "Current user error:",
            error
        );

        return null;

    }

}


// =====================================================
// ACTIVE CHAT USER
// =====================================================

function getActiveChatId(){

    return (
        localStorage.getItem(
            "activeChatId"
        ) || ""
    );

}


function getActiveChatName(){

    return (
        localStorage.getItem(
            "activeChatName"
        ) || "Connection"
    );

}


function getActiveChatSkill(){

    return (
        localStorage.getItem(
            "activeChatSkill"
        ) || "Skill Exchange"
    );

}


// =====================================================
// INITIALIZE
// =====================================================

function initializeChat(){

    currentUser =
        getCurrentUser();


    const activeChatId =
        getActiveChatId();


    const activeChatName =
        getActiveChatName();


    const activeChatSkill =
        getActiveChatSkill();


    console.log(
        "CURRENT USER:",
        currentUser
    );


    console.log(
        "ACTIVE CHAT ID:",
        activeChatId
    );


    if(
        !currentUser ||
        !currentUser.id
    ){

        alert(
            "Please login again."
        );

        window.location.href =
            "index.html";

        return;

    }


    if(!activeChatId){

        alert(
            "Chat user not selected."
        );

        window.location.href =
            "connections.html";

        return;

    }


    if(
        Number(currentUser.id)
        ===
        Number(activeChatId)
    ){

        alert(
            "You cannot chat with yourself."
        );

        window.location.href =
            "connections.html";

        return;

    }


    document.getElementById(
        "personName"
    ).textContent =
        activeChatName;


    document.getElementById(
        "skillName"
    ).textContent =
        "Skill: " +
        activeChatSkill;


    loadMessages();

}


// =====================================================
// LOAD MESSAGES
// =====================================================

async function loadMessages(){

    const activeChatId =
        getActiveChatId();


    if(
        !currentUser ||
        !currentUser.id ||
        !activeChatId
    ){

        return;

    }


    try{

        const response =
            await fetch(

                BACKEND_URL +
                "/api/messages/" +
                encodeURIComponent(
                    currentUser.id
                ) +
                "/" +
                encodeURIComponent(
                    activeChatId
                )

            );


        const data =
            await response.json();


        console.log(
            "MESSAGES RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load messages."
            );

        }


        const box =
            document.getElementById(
                "messages"
            );


        box.innerHTML = "";


        const messages =
            Array.isArray(
                data.messages
            )
            ? data.messages
            : [];


        if(
            messages.length === 0
        ){

            box.innerHTML = `

                <div class="empty">

                    💬 No messages yet.<br>

                    Start the conversation!

                </div>

            `;

            return;

        }


        messages.forEach(
            function(message){

                displayMessage(
                    message
                );

            }
        );


        box.scrollTop =
            box.scrollHeight;


    }
    catch(error){

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );


        const box =
            document.getElementById(
                "messages"
            );


        box.innerHTML = `

            <div class="empty">

                ❌ ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


// =====================================================
// DISPLAY MESSAGE
// =====================================================

function displayMessage(
    message
){

    const box =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    /*
    IMPORTANT:

    Backend returns:

    sender_id
    receiver_id
    created_at

    NOT:

    senderId
    receiverId
    createdAt
    */


    const senderId =
        Number(
            message.sender_id
        );


    const isMine =
        senderId ===
        Number(
            currentUser.id
        );


    div.className =
        isMine
        ? "message sent"
        : "message received";


    const messageText =
        escapeHTML(
            message.message ||
            ""
        );


    const createdAt =
        message.created_at
        ? formatDate(
            message.created_at
        )
        : "";


    div.innerHTML = `

        ${messageText}

        <span class="time">

            ${escapeHTML(
                createdAt
            )}

        </span>

    `;


    box.appendChild(
        div
    );

}


// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    const activeChatId =
        getActiveChatId();


    if(!text){

        return;

    }


    if(
        !currentUser ||
        !currentUser.id
    ){

        showError(
            "Please login again."
        );

        return;

    }


    if(!activeChatId){

        showError(
            "Receiver not selected."
        );

        return;

    }


    if(
        Number(currentUser.id)
        ===
        Number(activeChatId)
    ){

        showError(
            "You cannot send a message to yourself."
        );

        return;

    }


    input.disabled =
        true;


    sendButton.disabled =
        true;


    try{

        /*
        IMPORTANT FIX:

        Backend app.py expects:

        sender_id
        receiver_id
        message

        NOT:

        senderId
        receiverId
        */


        const requestBody = {

            sender_id:
                Number(
                    currentUser.id
                ),

            receiver_id:
                Number(
                    activeChatId
                ),

            message:
                text

        };


        console.log(
            "SENDING MESSAGE:",
            requestBody
        );


        const response =
            await fetch(

                BACKEND_URL +
                "/api/messages",

                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )

                }

            );


        const data =
            await response.json();


        console.log(
            "SEND MESSAGE RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Message failed."
            );

        }


        input.value =
            "";


        showSuccess(
            "Message sent!"
        );


        await loadMessages();


    }
    catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        showError(
            error.message
        );

    }
    finally{

        input.disabled =
            false;


        sendButton.disabled =
            false;


        input.focus();

    }

}


// =====================================================
// ENTER KEY
// =====================================================

function handleKey(
    event
){

    if(
        event.key ===
        "Enter"
    ){

        event.preventDefault();

        sendMessage();

    }

}


// =====================================================
// EMOJI
// =====================================================

function addEmoji(){

    const input =
        document.getElementById(
            "messageInput"
        );


    input.value +=
        " 😊";


    input.focus();

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(
    value
){

    try{

        const date =
            new Date(
                value
            );


        if(
            isNaN(
                date.getTime()
            )
        ){

            return String(
                value
            );

        }


        return date.toLocaleString();

    }
    catch(error){

        return String(
            value
        );

    }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
    value
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value
        );


    return div.innerHTML;

}


// =====================================================
// SUCCESS MESSAGE
// =====================================================

function showSuccess(
    text
){

    const box =
        document.getElementById(
            "success"
        );


    box.textContent =
        "✅ " + text;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        2500
    );

}


// =====================================================
// ERROR MESSAGE
// =====================================================

function showError(
    text
){

    const box =
        document.getElementById(
            "error"
        );


    box.textContent =
        "❌ " + text;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        4000
    );

}


// =====================================================
// AUTO REFRESH
// =====================================================

setInterval(
    function(){

        loadMessages();

    },
    3000
);


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const input =
            document.getElementById(
                "messageInput"
            );


        input.addEventListener(
            "keydown",
            handleKey
        );


        initializeChat();

    }
);

</script>

</body>

</html>
