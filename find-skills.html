<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Find Skills | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;

    background:
    radial-gradient(circle at 10% 10%,#59338d,transparent 30%),
    radial-gradient(circle at 90% 80%,#254d9c,transparent 30%),
    linear-gradient(135deg,#070711,#15132b);
}

/* NAVBAR */

.navbar{
    min-height:72px;
    padding:15px 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(10,10,20,.85);

    border-bottom:
    1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;

    padding:10px 16px;

    border-radius:10px;

    background:
    rgba(255,255,255,.08);
}

.back:hover{
    background:
    rgba(255,255,255,.15);
}

/* MAIN */

.container{
    width:90%;
    max-width:1050px;

    margin:45px auto;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.heading h1{
    font-size:42px;
    margin-bottom:10px;
}

.heading p{
    color:#aaa;
}

/* SUCCESS */

.success{
    display:none;

    padding:14px;

    margin-bottom:20px;

    text-align:center;

    border-radius:12px;

    color:#9be6a5;

    background:
    rgba(70,200,120,.15);

    border:
    1px solid rgba(70,200,120,.25);
}

/* SEARCH */

.search-box{
    display:flex;
    gap:10px;

    margin-bottom:30px;
}

.search-box input{
    flex:1;

    padding:15px;

    border:none;
    outline:none;

    border-radius:12px;

    color:white;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.08);
}

.search-box input::placeholder{
    color:#888;
}

.search-box button{
    padding:0 25px;

    border:none;
    border-radius:12px;

    color:white;
    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(90deg,#8066ff,#bd82ff);
}

.search-box button:hover{
    opacity:.9;
}

/* STATUS */

#status{
    text-align:center;
    color:#aaa;
    padding:30px;
}

/* CARDS */

.skills{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:20px;
}

.card{
    padding:25px;

    border-radius:20px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.1);

    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);

    background:
    rgba(255,255,255,.1);
}

.avatar{
    width:55px;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:25px;

    margin-bottom:15px;

    background:
    linear-gradient(135deg,#8066ff,#bd82ff);
}

.card h2{
    margin-bottom:6px;
}

.email{
    color:#999;
    font-size:13px;

    margin-bottom:15px;
}

.skill{
    display:inline-block;

    padding:7px 12px;

    border-radius:20px;

    color:#d7caff;

    background:
    rgba(130,100,255,.2);

    margin-bottom:20px;
}

.request-btn{
    width:100%;

    padding:13px;

    border:none;

    border-radius:11px;

    color:white;
    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(90deg,#8066ff,#bd82ff);
}

.request-btn:hover{
    opacity:.9;
}

.request-btn:disabled{
    opacity:.6;

    cursor:not-allowed;
}

/* MOBILE */

@media(max-width:700px){

    .skills{
        grid-template-columns:1fr;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        padding:14px;
    }

    .heading h1{
        font-size:32px;
    }

    .navbar{
        padding:15px 4%;
    }

    .logo{
        font-size:17px;
    }

    .back{
        padding:9px 12px;
        font-size:14px;
    }

}

</style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a href="dashboard.html"
       class="back">

        ← Dashboard

    </a>

</nav>


<!-- MAIN -->

<main class="container">


    <!-- HEADING -->

    <div class="heading">

        <h1>
            Find Skills 🔎
        </h1>

        <p>
            Discover people and exchange knowledge.
        </p>

    </div>


    <!-- SUCCESS MESSAGE -->

    <div id="success"
         class="success">
    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search name or skill..."
        >

        <button
            onclick="searchUsers()">

            Search

        </button>

    </div>


    <!-- STATUS -->

    <div id="status">
        🔄 Loading users...
    </div>


    <!-- USERS -->

    <div id="skills"
         class="skills">
    </div>


</main>


<script>


// =====================================================
// BACKEND
// =====================================================

const BACKEND_URL =
"https://talent-exchange-backend-p5wq.onrender.com";


let users = [];


// =====================================================
// GET CURRENT USER
// =====================================================

function getCurrentUser(){

    try{

        const profile =
            JSON.parse(
                localStorage.getItem(
                    "userProfile"
                ) || "{}"
            );

        return profile;

    }
    catch(error){

        console.error(
            "Profile error:",
            error
        );

        return {};

    }

}


// =====================================================
// LOAD USERS
// =====================================================

async function loadUsers(){

    const status =
        document.getElementById(
            "status"
        );

    try{

        status.innerHTML =
            "🔄 Loading users...";


        const response =
            await fetch(
                BACKEND_URL +
                "/api/users"
            );


        const data =
            await response.json();


        console.log(
            "Users API:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to load users."
            );

        }


        users =
            Array.isArray(data.users)
            ? data.users
            : [];


        displayUsers(users);

    }
    catch(error){

        console.error(
            "LOAD USERS ERROR:",
            error
        );


        status.innerHTML =
        "❌ Unable to load users.<br><br>" +
        error.message;

    }

}


// =====================================================
// DISPLAY USERS
// =====================================================

function displayUsers(list){

    const container =
        document.getElementById(
            "skills"
        );

    const status =
        document.getElementById(
            "status"
        );


    container.innerHTML =
        "";


    const profile =
        getCurrentUser();


    const currentId =
        profile.id;


    const currentEmail =
        (
            profile.email ||
            localStorage.getItem(
                "currentUser"
            ) ||
            ""
        ).toLowerCase();


    const otherUsers =
        list.filter(function(user){

            const userEmail =
                (
                    user.email ||
                    ""
                ).toLowerCase();


            // Remove logged-in user

            if(
                currentId &&
                Number(user.id) ===
                Number(currentId)
            ){

                return false;

            }


            if(
                currentEmail &&
                userEmail ===
                currentEmail
            ){

                return false;

            }


            return true;

        });


    if(otherUsers.length === 0){

        status.innerHTML =
            "👥 No other users found yet.";

        return;

    }


    status.innerHTML =
        "";


    otherUsers.forEach(function(user){

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        const name =
            user.name ||
            "Unknown User";


        const email =
            user.email ||
            "";


        const skill =
            user.skill ||
            "Skill not added";


        const avatar =
            name
            .charAt(0)
            .toUpperCase();


        card.innerHTML = `

            <div class="avatar">
                ${avatar}
            </div>

            <h2>
                ${escapeHTML(name)}
            </h2>

            <div class="email">
                ${escapeHTML(email)}
            </div>

            <div class="skill">
                🛠️ ${escapeHTML(skill)}
            </div>

            <button
                class="request-btn"
                data-user-id="${user.id}">

                🤝 Request Exchange

            </button>

        `;


        const button =
            card.querySelector(
                ".request-btn"
            );


        button.addEventListener(
            "click",
            function(){

                sendRequest(
                    user.id,
                    name,
                    skill,
                    button
                );

            }
        );


        container.appendChild(
            card
        );

    });

}


// =====================================================
// SEARCH
// =====================================================

function searchUsers(){

    const input =
        document.getElementById(
            "search"
        );


    const value =
        input.value
        .toLowerCase()
        .trim();


    if(!value){

        displayUsers(users);

        return;

    }


    const filtered =
        users.filter(
            function(user){

                const name =
                    (
                        user.name ||
                        ""
                    ).toLowerCase();


                const skill =
                    (
                        user.skill ||
                        ""
                    ).toLowerCase();


                const learning =
                    (
                        user.learning_skill ||
                        ""
                    ).toLowerCase();


                return (

                    name.includes(value) ||

                    skill.includes(value) ||

                    learning.includes(value)

                );

            }
        );


    displayUsers(
        filtered
    );

}


// =====================================================
// LIVE SEARCH
// =====================================================

document
    .getElementById("search")
    .addEventListener(
        "input",
        function(){

            searchUsers();

        }
    );


// =====================================================
// SEND REQUEST
// =====================================================

async function sendRequest(
    receiverId,
    receiverName,
    skill,
    button
){

    const profile =
        getCurrentUser();


    const senderId =
        profile.id;


    // -----------------------------------------------
    // LOGIN CHECK
    // -----------------------------------------------

    if(!senderId){

        alert(
            "Please login again."
        );

        return;

    }


    // -----------------------------------------------
    // PREVENT SELF REQUEST
    // -----------------------------------------------

    if(
        Number(senderId) ===
        Number(receiverId)
    ){

        alert(
            "You cannot send a request to yourself."
        );

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "Sending...";


    try{

        // -------------------------------------------
        // IMPORTANT:
        // Python backend expects
        // sender_id and receiver_id
        // -------------------------------------------

        const response =
            await fetch(
                BACKEND_URL +
                "/api/requests",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        sender_id:
                        Number(senderId),

                        receiver_id:
                        Number(receiverId),

                        skill:
                        skill

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "Request API:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Request failed."
            );

        }


        // -------------------------------------------
        // SUCCESS
        // -------------------------------------------

        button.textContent =
            "✓ Request Sent";


        showSuccess(
            "✅ Request sent to " +
            receiverName
        );


    }
    catch(error){

        console.error(
            "REQUEST ERROR:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            "🤝 Request Exchange";


        alert(
            "❌ " +
            error.message
        );

    }

}


// =====================================================
// SUCCESS MESSAGE
// =====================================================

function showSuccess(
    text
){

    const box =
        document.getElementById(
            "success"
        );


    box.textContent =
        text;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        3000
    );

}


// =====================================================
// HTML SAFETY
// =====================================================

function escapeHTML(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// START
// =====================================================

loadUsers();


</script>

</body>

</html>
