<script>

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


async function registerUser(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const skill =
        document.getElementById("skill").value.trim();


    if (!name || !email || !password || !skill) {

        alert("Please fill all fields.");

        return;
    }


    try {

        const response = await fetch(
            BACKEND_URL + "/api/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    email: email,

                    password: password,

                    skill: skill

                })
            }
        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Registration failed."
            );

        }


        alert(
            "Account created successfully! 🎉"
        );


        window.location.href =
            "login.html";


    } catch (error) {

        console.error(
            "Signup Error:",
            error
        );


        alert(
            "❌ " +
            (
                error.message ||
                "Unable to connect to server."
            )
        );

    }

}

</script>
