<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Requests | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;

    background:
    radial-gradient(circle at 10% 10%,#59338d,transparent 30%),
    radial-gradient(circle at 90% 80%,#254d9c,transparent 30%),
    linear-gradient(135deg,#070711,#15132b);
}

.navbar{
    min-height:72px;
    padding:15px 6%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(10,10,20,.85);

    border-bottom:
    1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;

    padding:10px 16px;

    border-radius:10px;

    background:rgba(255,255,255,.08);
}

.container{
    width:90%;
    max-width:1000px;

    margin:45px auto;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.heading h1{
    font-size:40px;
    margin-bottom:10px;
}

.heading p{
    color:#aaa;
}

.status{
    text-align:center;
    color:#aaa;
    padding:30px;
}

.requests{
    display:grid;
    gap:20px;
}

.card{
    padding:25px;

    border-radius:20px;

    background:rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.1);
}

.avatar{
    width:55px;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:24px;

    margin-bottom:15px;

    background:
    linear-gradient(135deg,#8066ff,#bd82ff);
}

.card h2{
    margin-bottom:7px;
}

.email{
    color:#999;
    font-size:13px;
    margin-bottom:15px;
}

.skill{
    display:inline-block;

    padding:7px 12px;

    border-radius:20px;

    color:#d7caff;

    background:rgba(130,100,255,.2);

    margin-bottom:18px;
}

.status-badge{
    display:inline-block;

    padding:7px 12px;

    border-radius:20px;

    background:rgba(255,255,255,.08);

    color:#ccc;

    margin-bottom:18px;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    flex:1;

    padding:13px;

    border:none;

    border-radius:11px;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.accept{
    background:
    linear-gradient(90deg,#3bbf72,#5bd98d);
}

.reject{
    background:
    linear-gradient(90deg,#d94d5b,#ef7180);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.success{
    display:none;

    padding:14px;

    margin-bottom:20px;

    text-align:center;

    border-radius:12px;

    color:#9be6a5;

    background:rgba(70,200,120,.15);
}

.error{
    display:none;

    padding:14px;

    margin-bottom:20px;

    text-align:center;

    border-radius:12px;

    color:#ff9b9b;

    background:rgba(220,60,70,.15);
}

@media(max-width:700px){

    .heading h1{
        font-size:32px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</nav>


<main class="container">


    <div class="heading">

        <h1>
            My Requests 🤝
        </h1>

        <p>
            Manage your talent exchange requests.
        </p>

    </div>


    <div
        id="success"
        class="success"
    ></div>


    <div
        id="error"
        class="error"
    ></div>


    <div
        id="status"
        class="status"
    >
        🔄 Loading requests...
    </div>


    <div
        id="requests"
        class="requests"
    ></div>


</main>


<script>


// =====================================================
// BACKEND
// =====================================================

const BACKEND_URL =
"https://talent-exchange-backend-p5wq.onrender.com";


// =====================================================
// CURRENT USER
// =====================================================

let currentUser = null;


// =====================================================
// GET CURRENT USER
// =====================================================

function getCurrentUser(){

    try{

        const profile =
            JSON.parse(
                localStorage.getItem(
                    "userProfile"
                ) || "null"
            );


        if(profile){

            return profile;

        }


        // Backup localStorage names

        const user =
            JSON.parse(
                localStorage.getItem(
                    "user"
                ) || "null"
            );


        return user || {};

    }

    catch(error){

        console.error(
            "USER ERROR:",
            error
        );

        return {};

    }

}


// =====================================================
// LOAD REQUESTS
// =====================================================

async function loadRequests(){

    const status =
        document.getElementById(
            "status"
        );


    const container =
        document.getElementById(
            "requests"
        );


    currentUser =
        getCurrentUser();


    console.log(
        "CURRENT USER:",
        currentUser
    );


    if(
        !currentUser ||
        !currentUser.id
    ){

        status.innerHTML =
            "❌ Please login again.";

        return;

    }


    try{

        status.innerHTML =
            "🔄 Loading requests...";


        container.innerHTML =
            "";


        /*
        IMPORTANT:

        New backend endpoint:

        /api/requests/user/<user_id>

        */

        const response =
            await fetch(

                BACKEND_URL +
                "/api/requests/user/" +
                encodeURIComponent(
                    currentUser.id
                )

            );


        const data =
            await response.json();


        console.log(
            "REQUEST RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to load requests."
            );

        }


        const requests =
            Array.isArray(
                data.requests
            )
            ? data.requests
            : [];


        if(
            requests.length === 0
        ){

            status.innerHTML =
                "📭 No requests yet.";

            return;

        }


        status.innerHTML =
            "";


        requests.forEach(
            function(req){

                displayRequest(req);

            }
        );


    }

    catch(error){

        console.error(
            "LOAD REQUEST ERROR:",
            error
        );


        status.innerHTML =
            "❌ " +
            error.message;

    }

}


// =====================================================
// DISPLAY REQUEST
// =====================================================

function displayRequest(req){

    const container =
        document.getElementById(
            "requests"
        );


    const isReceiver =
        Number(
            req.receiver_id
        ) === Number(
            currentUser.id
        );


    const otherName =
        isReceiver
        ? req.sender_name
        : req.receiver_name;


    const otherEmail =
        isReceiver
        ? req.sender_email
        : req.receiver_email;


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    const initial =
        (
            otherName ||
            "?"
        )
        .charAt(0)
        .toUpperCase();


    let buttons = "";


    // =================================================
    // ONLY RECEIVER CAN ACCEPT / REJECT
    // =================================================

    if(
        isReceiver &&
        req.status === "pending"
    ){

        buttons = `

            <div class="buttons">

                <button
                    class="accept"
                    onclick="
                        acceptRequest(
                            ${req.id},
                            this
                        )
                    "
                >

                    ✓ Accept

                </button>


                <button
                    class="reject"
                    onclick="
                        rejectRequest(
                            ${req.id},
                            this
                        )
                    "
                >

                    ✕ Reject

                </button>

            </div>

        `;

    }


    // =================================================
    // SENT REQUEST
    // =================================================

    if(
        !isReceiver &&
        req.status === "pending"
    ){

        buttons = `

            <div class="status-badge">

                ⏳ Waiting for response

            </div>

        `;

    }


    // =================================================
    // ACCEPTED
    // =================================================

    if(
        req.status === "accepted"
    ){

        buttons = `

            <div class="status-badge">

                ✅ Connected

            </div>

        `;

    }


    // =================================================
    // REJECTED
    // =================================================

    if(
        req.status === "rejected"
    ){

        buttons = `

            <div class="status-badge">

                ❌ Request rejected

            </div>

        `;

    }


    card.innerHTML = `

        <div class="avatar">

            ${escapeHTML(initial)}

        </div>


        <h2>

            ${escapeHTML(
                otherName ||
                "Unknown User"
            )}

        </h2>


        <div class="email">

            ${escapeHTML(
                otherEmail ||
                ""
            )}

        </div>


        <div class="skill">

            🛠️
            ${escapeHTML(
                req.skill ||
                "Skill"
            )}

        </div>


        <br>


        <div class="status-badge">

            Status:
            ${escapeHTML(
                req.status ||
                "pending"
            )}

        </div>


        ${buttons}

    `;


    container.appendChild(
        card
    );

}


// =====================================================
// ACCEPT REQUEST
// =====================================================

async function acceptRequest(
    requestId,
    button
){

    const parent =
        button.closest(
            ".buttons"
        );


    const buttons =
        parent.querySelectorAll(
            "button"
        );


    buttons.forEach(
        function(btn){

            btn.disabled =
                true;

        }
    );


    button.textContent =
        "Accepting...";


    try{

        /*
        IMPORTANT:

        Backend endpoint:

        POST
        /api/requests/<request_id>/accept

        */

        const response =
            await fetch(

                BACKEND_URL +
                "/api/requests/" +
                requestId +
                "/accept",

                {

                    method:
                    "POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    }

                }

            );


        const data =
            await response.json();


        console.log(
            "ACCEPT RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to accept request."
            );

        }


        showSuccess(
            "✅ Request accepted successfully!"
        );


        setTimeout(
            function(){

                loadRequests();

            },
            500
        );


    }

    catch(error){

        console.error(
            "ACCEPT ERROR:",
            error
        );


        showError(
            "❌ " +
            error.message
        );


        buttons.forEach(
            function(btn){

                btn.disabled =
                    false;

            }
        );


        button.textContent =
            "✓ Accept";

    }

}


// =====================================================
// REJECT REQUEST
// =====================================================

async function rejectRequest(
    requestId,
    button
){

    const parent =
        button.closest(
            ".buttons"
        );


    const buttons =
        parent.querySelectorAll(
            "button"
        );


    buttons.forEach(
        function(btn){

            btn.disabled =
                true;

        }
    );


    button.textContent =
        "Rejecting...";


    try{

        const response =
            await fetch(

                BACKEND_URL +
                "/api/requests/" +
                requestId +
                "/reject",

                {

                    method:
                    "POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    }

                }

            );


        const data =
            await response.json();


        console.log(
            "REJECT RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to reject request."
            );

        }


        showSuccess(
            "❌ Request rejected."
        );


        setTimeout(
            function(){

                loadRequests();

            },
            500
        );


    }

    catch(error){

        console.error(
            "REJECT ERROR:",
            error
        );


        showError(
            "❌ " +
            error.message
        );


        buttons.forEach(
            function(btn){

                btn.disabled =
                    false;

            }
        );


        button.textContent =
            "✕ Reject";

    }

}


// =====================================================
// SUCCESS
// =====================================================

function showSuccess(
    text
){

    const box =
        document.getElementById(
            "success"
        );


    box.textContent =
        text;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        3000
    );

}


// =====================================================
// ERROR
// =====================================================

function showError(
    text
){

    const box =
        document.getElementById(
            "error"
        );


    box.textContent =
        text;


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        4000
    );

}


// =====================================================
// HTML SAFETY
// =====================================================

function escapeHTML(
    value
){

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadRequests();

    }
);

</script>

</body>

</html>
