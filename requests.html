<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Requests | Talent Exchange</title>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    color:white;

    background:
        radial-gradient(
            circle at 10% 10%,
            #59338d,
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 80%,
            #254d9c,
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #070711,
            #15132b
        );

}


/* =========================
   NAVBAR
========================= */

.navbar{

    min-height:72px;

    padding:15px 6%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    background:
        rgba(10,10,20,0.85);

    border-bottom:
        1px solid rgba(255,255,255,0.1);

    backdrop-filter:
        blur(18px);

}


.logo{

    font-size:21px;

    font-weight:bold;

}


.back{

    color:white;

    text-decoration:none;

    padding:10px 16px;

    border-radius:10px;

    background:
        rgba(255,255,255,0.08);

    transition:0.3s;

}


.back:hover{

    background:
        rgba(255,255,255,0.15);

}


/* =========================
   CONTAINER
========================= */

.container{

    width:90%;

    max-width:900px;

    margin:45px auto;

}


/* =========================
   HEADING
========================= */

.heading{

    text-align:center;

    margin-bottom:35px;

}


.heading h1{

    font-size:40px;

    margin-bottom:10px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c49cff
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}


.heading p{

    color:#aaa;

    font-size:15px;

}


/* =========================
   LOADING / EMPTY
========================= */

#status{

    text-align:center;

    color:#aaa;

    padding:35px;

    font-size:16px;

}


/* =========================
   REQUEST LIST
========================= */

.requests{

    display:grid;

    gap:20px;

}


/* =========================
   REQUEST CARD
========================= */

.request-card{

    padding:25px;

    border-radius:20px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.1);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.2);

    transition:0.3s;

}


.request-card:hover{

    transform:
        translateY(-4px);

    background:
        rgba(255,255,255,0.09);

}


/* =========================
   USER
========================= */

.user{

    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:20px;

}


.avatar{

    width:60px;

    height:60px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    font-size:27px;

    background:
        linear-gradient(
            135deg,
            #8066ff,
            #bd82ff
        );

}


.user h2{

    font-size:20px;

    margin-bottom:5px;

}


.user p{

    color:#aaa;

    font-size:14px;

}


/* =========================
   SKILL
========================= */

.skill{

    display:inline-block;

    padding:9px 14px;

    border-radius:20px;

    color:#d7caff;

    background:
        rgba(130,100,255,0.2);

    font-size:14px;

    margin-bottom:18px;

}


/* =========================
   STATUS
========================= */

.request-status{

    margin-top:5px;

    margin-bottom:20px;

    color:#aaa;

    font-size:14px;

}


.pending{

    color:#ffd580;

}


.accepted{

    color:#9be6a5;

}


.rejected{

    color:#ffaaaa;

}


/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    gap:12px;

}


.accept,
.reject{

    flex:1;

    padding:13px;

    border:none;

    border-radius:11px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}


.accept{

    background:
        linear-gradient(
            90deg,
            #4caf75,
            #66c98c
        );

}


.reject{

    background:
        rgba(255,80,80,0.18);

    color:#ffaaaa;

}


.accept:hover{

    transform:
        translateY(-2px);

}


.reject:hover{

    background:
        rgba(255,80,80,0.28);

}


.accept:disabled,
.reject:disabled{

    opacity:0.5;

    cursor:not-allowed;

}


/* =========================
   ERROR
========================= */

.error-box{

    display:none;

    margin-bottom:20px;

    padding:15px;

    border-radius:12px;

    text-align:center;

    color:#ffaaaa;

    background:
        rgba(255,70,70,0.12);

    border:
        1px solid
        rgba(255,70,70,0.15);

}


/* =========================
   SUCCESS
========================= */

.success-box{

    display:none;

    margin-bottom:20px;

    padding:15px;

    border-radius:12px;

    text-align:center;

    color:#9be6a5;

    background:
        rgba(70,200,120,0.12);

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .navbar{

        padding:15px;

    }


    .logo{

        font-size:18px;

    }


    .back{

        padding:8px 11px;

        font-size:13px;

    }


    .container{

        width:92%;

        margin:30px auto;

    }


    .heading h1{

        font-size:32px;

    }


    .buttons{

        flex-direction:column;

    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">


    <div class="logo">

        ✨ Talent Exchange

    </div>


    <a
        href="dashboard.html"
        class="back"
    >

        ← Dashboard

    </a>


</nav>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <div class="heading">

        <h1>

            My Requests 📨

        </h1>


        <p>

            Manage your talent exchange requests.

        </p>

    </div>



    <!-- ERROR -->

    <div
        id="errorBox"
        class="error-box"
    >

    </div>



    <!-- SUCCESS -->

    <div
        id="successBox"
        class="success-box"
    >

    </div>



    <!-- STATUS -->

    <div
        id="status"
    >

        🔄 Loading requests...

    </div>



    <!-- REQUESTS -->

    <div
        id="requests"
        class="requests"
    >

    </div>


</main>



<script>


/* ==========================================
   BACKEND URL
========================================== */

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


/* ==========================================
   GET LOGGED-IN USER
========================================== */

function getCurrentUser(){

    try{

        const savedProfile =
            localStorage.getItem(
                "userProfile"
            );


        if(!savedProfile){

            return null;

        }


        return JSON.parse(
            savedProfile
        );


    }
    catch(error){

        console.error(
            "Profile error:",
            error
        );

        return null;

    }

}


/* ==========================================
   SHOW ERROR
========================================== */

function showError(message){

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent =
        "❌ " + message;


    errorBox.style.display =
        "block";

}


/* ==========================================
   SHOW SUCCESS
========================================== */

function showSuccess(message){

    const successBox =
        document.getElementById(
            "successBox"
        );


    successBox.textContent =
        "✅ " + message;


    successBox.style.display =
        "block";


    setTimeout(function(){

        successBox.style.display =
            "none";

    },3000);

}


/* ==========================================
   LOAD REQUESTS
========================================== */

async function loadRequests(){

    const status =
        document.getElementById(
            "status"
        );


    const container =
        document.getElementById(
            "requests"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.style.display =
        "none";


    container.innerHTML =
        "";


    status.innerHTML =
        "🔄 Loading requests...";


    /* GET USER */

    const user =
        getCurrentUser();


    console.log(
        "Current user:",
        user
    );


    /* CHECK USER */

    if(!user){

        status.innerHTML =
            "";


        showError(
            "Please login first."
        );

        return;

    }


    /* CHECK USER ID */

    if(!user.id){

        status.innerHTML =
            "";


        showError(
            "User ID not found. Please logout and login again."
        );

        console.error(
            "userProfile does not contain id:",
            user
        );

        return;

    }


    console.log(
        "Loading requests for user ID:",
        user.id
    );


    try{


        /* API REQUEST */

        const response =
            await fetch(

                BACKEND_URL +
                "/api/requests/" +
                encodeURIComponent(
                    user.id
                )

            );


        console.log(
            "Response status:",
            response.status
        );


        const data =
            await response.json();


        console.log(
            "Requests API:",
            data
        );


        /* API ERROR */

        if(!response.ok){

            throw new Error(

                data.message ||
                "Unable to load requests."

            );

        }


        const requests =
            data.requests || [];


        /* NO REQUESTS */

        if(
            requests.length === 0
        ){

            status.innerHTML = `
                📭 No requests yet.
                <br><br>
                <small>
                    When someone sends you a
                    talent exchange request,
                    it will appear here.
                </small>
            `;

            return;

        }


        /* REQUESTS FOUND */

        status.innerHTML =
            `📨 ${requests.length} request${
                requests.length === 1
                ? ""
                : "s"
            } found`;


        /* DISPLAY */

        requests.forEach(
            function(request){

                createRequestCard(
                    request,
                    container
                );

            }
        );


    }
    catch(error){

        console.error(
            "Load requests error:",
            error
        );


        status.innerHTML =
            "";


        showError(
            error.message ||
            "Unable to connect to backend."
        );

    }

}


/* ==========================================
   CREATE REQUEST CARD
========================================== */

function createRequestCard(
    request,
    container
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "request-card";


    const sender =
        request.sender || {};


    const senderName =
        sender.name ||
        "Unknown User";


    const senderEmail =
        sender.email ||
        "";


    const skill =
        request.skill ||
        "Unknown Skill";


    const requestStatus =
        request.status ||
        "pending";


    /* PENDING */

    let actionHTML = "";


    if(
        requestStatus ===
        "pending"
    ){

        actionHTML = `

            <div class="buttons">

                <button
                    class="accept"
                    onclick="
                        updateRequest(
                            ${request.id},
                            'accepted',
                            this
                        )
                    "
                >

                    ✅ Accept

                </button>


                <button
                    class="reject"
                    onclick="
                        updateRequest(
                            ${request.id},
                            'rejected',
                            this
                        )
                    "
                >

                    ❌ Reject

                </button>

            </div>

        `;

    }


    /* ACCEPTED */

    if(
        requestStatus ===
        "accepted"
    ){

        actionHTML = `

            <div class="request-status accepted">

                ✅ You accepted this request.

            </div>

        `;

    }


    /* REJECTED */

    if(
        requestStatus ===
        "rejected"
    ){

        actionHTML = `

            <div class="request-status rejected">

                ❌ You rejected this request.

            </div>

        `;

    }


    card.innerHTML = `

        <div class="user">

            <div class="avatar">

                👤

            </div>


            <div>

                <h2>

                    ${escapeHTML(
                        senderName
                    )}

                </h2>


                <p>

                    ${escapeHTML(
                        senderEmail
                    )}

                </p>

            </div>

        </div>


        <div class="skill">

            🛠️ Skill:

            ${escapeHTML(
                skill
            )}

        </div>


        <div class="
            request-status
            ${escapeHTML(
                requestStatus
            )}
        ">

            Status:

            <strong>

                ${escapeHTML(
                    requestStatus
                )}

            </strong>

        </div>


        ${actionHTML}

    `;


    container.appendChild(
        card
    );

}


/* ==========================================
   ACCEPT / REJECT REQUEST
========================================== */

async function updateRequest(
    requestId,
    newStatus,
    button
){

    const card =
        button.closest(
            ".request-card"
        );


    const buttons =
        card.querySelectorAll(
            "button"
        );


    buttons.forEach(
        function(btn){

            btn.disabled =
                true;

        }
    );


    try{


        const response =
            await fetch(

                BACKEND_URL +
                "/api/requests/" +
                requestId,

                {

                    method:
                        "PUT",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }

            );


        const data =
            await response.json();


        console.log(
            "Update response:",
            data
        );


        if(!response.ok){

            throw new Error(

                data.message ||
                "Unable to update request."

            );

        }


        if(
            newStatus ===
            "accepted"
        ){

            showSuccess(
                "Request accepted successfully!"
            );

        }
        else{

            showSuccess(
                "Request rejected."
            );

        }


        /* RELOAD */

        setTimeout(
            function(){

                loadRequests();

            },
            500
        );


    }
    catch(error){

        console.error(
            "Update request error:",
            error
        );


        showError(
            error.message ||
            "Unable to update request."
        );


        buttons.forEach(
            function(btn){

                btn.disabled =
                    false;

            }
        );

    }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   START
========================================== */

loadRequests();


</script>


</body>

</html>
