<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Exchange Requests | Talent Exchange</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: white;

    background:
        radial-gradient(
            circle at 10% 10%,
            #58348c,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            #244c9b,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #070711,
            #15132b
        );
}

/* NAVBAR */

.navbar {
    min-height: 72px;
    padding: 12px 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(10,10,20,0.78);

    border-bottom:
        1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(18px);
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.back {
    color: white;
    text-decoration: none;

    padding: 10px 16px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);
}

/* MAIN */

.container {
    width: 90%;
    max-width: 900px;
    margin: 50px auto;
}

.heading {
    text-align: center;
    margin-bottom: 35px;
}

.heading h1 {
    font-size: 40px;
    margin-bottom: 10px;

    background:
        linear-gradient(
            90deg,
            white,
            #c49cff
        );

    -webkit-background-clip: text;
    color: transparent;
}

.heading p {
    color: #aaa;
}

/* REQUEST CARD */

.request-card {

    display: flex;
    align-items: center;

    gap: 20px;

    padding: 23px;

    margin-bottom: 18px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(15px);

    transition: 0.3s;
}

.request-card:hover {
    transform: translateY(-3px);

    background:
        rgba(255,255,255,0.10);
}

/* AVATAR */

.avatar {

    width: 62px;
    height: 62px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 27px;

    background:
        linear-gradient(
            135deg,
            #8066ff,
            #bd82ff
        );
}

/* INFO */

.info {
    flex: 1;
}

.info h2 {
    margin-bottom: 7px;
}

.info p {
    color: #aaa;
    margin-bottom: 9px;
}

.skill {

    display: inline-block;

    padding: 6px 11px;

    border-radius: 20px;

    color: #d5c7ff;

    background:
        rgba(130,100,255,0.18);

    font-size: 13px;
}

/* ACTIONS */

.actions {

    display: flex;
    gap: 10px;
}

.actions button {

    border: none;

    padding: 11px 17px;

    border-radius: 10px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.actions button:hover {
    transform: translateY(-2px);
}

.accept {

    background:
        linear-gradient(
            90deg,
            #35b875,
            #42d392
        );
}

.reject {

    background:
        rgba(255,80,100,0.16);

    color: #ff9ba7 !important;
}

/* EMPTY */

.empty {

    text-align: center;

    padding: 70px 20px;

    color: #aaa;

    display: none;
}

.empty-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.empty h2 {
    color: white;
    margin-bottom: 8px;
}

/* SUCCESS */

.message {

    display: none;

    text-align: center;

    padding: 14px;

    margin-bottom: 20px;

    border-radius: 12px;

    background:
        rgba(70,200,120,0.15);

    color: #9be6a5;
}


/* MOBILE */

@media(max-width:700px) {

    .request-card {
        flex-direction: column;
        text-align: center;
    }

    .actions {
        width: 100%;
    }

    .actions button {
        flex: 1;
    }

    .heading h1 {
        font-size: 31px;
    }
}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</nav>


<main class="container">


    <div class="heading">

        <h1>
            Exchange Requests 📨
        </h1>

        <p>
            Accept requests to create a new connection.
        </p>

    </div>


    <div
        class="message"
        id="message"
    >
    </div>


    <!-- REQUESTS -->

    <div id="requestList"></div>


    <!-- EMPTY -->

    <div
        class="empty"
        id="empty"
    >

        <div class="empty-icon">
            📨
        </div>

        <h2>
            No pending requests
        </h2>

        <p>
            New skill exchange requests will appear here.
        </p>

    </div>


</main>


<script>


/* LOAD REQUESTS */

function loadRequests() {

    let requests =
        JSON.parse(
            localStorage.getItem(
                "exchangeRequests"
            )
        ) || [];


    const list =
        document.getElementById(
            "requestList"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    list.innerHTML = "";


    /* ONLY PENDING REQUESTS */

    const pending =
        requests.filter(
            request =>
                request.status === "pending"
        );


    if (pending.length === 0) {

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    pending.forEach(
        request => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "request-card";


            card.innerHTML = `

                <div class="avatar">
                    ${request.avatar || "👤"}
                </div>

                <div class="info">

                    <h2>
                        ${request.name}
                    </h2>

                    <p>
                        Wants to exchange skills with you
                    </p>

                    <span class="skill">
                        ${request.skill}
                    </span>

                </div>

                <div class="actions">

                    <button
                        class="accept"
                        onclick="acceptRequest(${request.id})"
                    >
                        ✅ Accept
                    </button>

                    <button
                        class="reject"
                        onclick="rejectRequest(${request.id})"
                    >
                        ❌ Reject
                    </button>

                </div>

            `;


            list.appendChild(card);

        }
    );

}


/* ACCEPT */

function acceptRequest(id) {

    let requests =
        JSON.parse(
            localStorage.getItem(
                "exchangeRequests"
            )
        ) || [];


    const request =
        requests.find(
            item => item.id === id
        );


    if (!request) {
        return;
    }


    /* CHANGE STATUS */

    request.status =
        "accepted";


    /* SAVE REQUEST */

    localStorage.setItem(
        "exchangeRequests",
        JSON.stringify(requests)
    );


    /* ADD CONNECTION */

    let connections =
        JSON.parse(
            localStorage.getItem(
                "connections"
            )
        ) || [];


    const alreadyConnected =
        connections.some(
            connection =>
                connection.name ===
                request.name
        );


    if (!alreadyConnected) {

        connections.push({

            id: request.id,

            name: request.name,

            skill: request.skill,

            avatar:
                request.avatar || "👤"

        });

    }


    localStorage.setItem(
        "connections",
        JSON.stringify(connections)
    );


    showMessage(
        "✅ Request accepted! Connection created."
    );


    loadRequests();

}


/* REJECT */

function rejectRequest(id) {

    let requests =
        JSON.parse(
            localStorage.getItem(
                "exchangeRequests"
            )
        ) || [];


    const updated =
        requests.filter(
            request =>
                request.id !== id
        );


    localStorage.setItem(
        "exchangeRequests",
        JSON.stringify(updated)
    );


    showMessage(
        "❌ Exchange request rejected."
    );


    loadRequests();

}


/* MESSAGE */

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.style.display =
        "block";


    setTimeout(
        function() {

            message.style.display =
                "none";

        },
        2500
    );

}


/* START */

loadRequests();


</script>


</body>

</html>
