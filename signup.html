<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account | Talent Exchange</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    background:
        radial-gradient(
            circle at 15% 15%,
            #5b358d,
            transparent 32%
        ),

        radial-gradient(
            circle at 85% 85%,
            #254e9d,
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #070711,
            #15132b
        );

}

.signup-container {

    width: 90%;
    max-width: 450px;
    padding: 20px;

}

.logo {

    text-align: center;
    margin-bottom: 25px;

}

.logo-icon {

    font-size: 48px;
    margin-bottom: 8px;

}

.logo h1 {

    font-size: 30px;

}

.logo p {

    color: #aaa;
    margin-top: 8px;

}

.signup-card {

    padding: 32px;

    border-radius: 24px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.12);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);

}

.signup-card h2 {

    text-align: center;

    margin-bottom: 25px;

    font-size: 25px;

}

.input-group {

    margin-bottom: 17px;

}

.input-group label {

    display: block;

    margin-bottom: 8px;

    color: #ddd;

    font-size: 14px;

}

.input-group input {

    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,0.12);

    outline: none;

    color: white;

    background:
        rgba(255,255,255,0.08);

    font-size: 15px;

}

.input-group input:focus {

    border-color: #a786ff;

    background:
        rgba(255,255,255,0.11);

}

.create-btn {

    width: 100%;

    padding: 14px;

    margin-top: 5px;

    border: none;

    border-radius: 12px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #8066ff,
            #bd82ff
        );

    transition: 0.3s;

}

.create-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(128,102,255,0.3);

}

.create-btn:disabled {

    opacity: 0.6;

    cursor: not-allowed;

    transform: none;

}

.message {

    display: none;

    margin-bottom: 15px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    font-size: 14px;

}

.error {

    color: #ffaaaa;

    background:
        rgba(255,70,70,0.12);

}

.success {

    color: #9be6a5;

    background:
        rgba(70,200,120,0.15);

}

.login-text {

    text-align: center;

    margin-top: 22px;

    color: #aaa;

    font-size: 14px;

}

.login-link {

    display: block;

    margin-top: 10px;

    text-align: center;

    color: #c9b7ff;

    text-decoration: none;

    font-weight: bold;

}

.login-link:hover {

    text-decoration: underline;

}

@media(max-width:500px) {

    .signup-card {

        padding: 25px 20px;

    }

    .logo h1 {

        font-size: 26px;

    }

}

</style>

</head>


<body>


<div class="signup-container">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            ✨
        </div>

        <h1>
            Talent Exchange
        </h1>

        <p>
            Learn • Share • Connect
        </p>

    </div>


    <!-- CARD -->

    <div class="signup-card">


        <h2>
            Create Your Account 🚀
        </h2>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="message error">
        </div>


        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="message success">
        </div>


        <!-- FORM -->

        <form id="signupForm">


            <!-- NAME -->

            <div class="input-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>


            <!-- CONFIRM -->

            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="create-btn"
                id="createButton">

                ✨ Create New Account

            </button>


        </form>


        <div class="login-text">

            Already have an account?

        </div>


        <a
            href="login.html"
            class="login-link">

            ← Back to Login

        </a>


    </div>

</div>


<!-- =========================================
     SUPABASE JAVASCRIPT LIBRARY
========================================= -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
    "https://uigekrizjpypvxrpnzy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zbxRmxoGjU8fqrv04QWahQ_QW36q2dh";


/* =========================================
   CHECK SUPABASE LIBRARY
========================================= */

if (!window.supabase) {

    const errorBox =
        document.getElementById("errorMessage");

    errorBox.textContent =
        "❌ Supabase library could not load. Please refresh the page.";

    errorBox.style.display =
        "block";

    throw new Error(
        "Supabase JavaScript library not loaded"
    );

}


/* =========================================
   CREATE SUPABASE CLIENT
========================================= */

const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );


console.log(
    "✅ Supabase client initialized"
);


/* =========================================
   SIGNUP FORM
========================================= */

const signupForm =
    document.getElementById("signupForm");


signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* =================================
           GET INPUT VALUES
        ================================= */

        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const errorMessage =
            document
            .getElementById("errorMessage");


        const successMessage =
            document
            .getElementById("successMessage");


        const createButton =
            document
            .getElementById("createButton");


        /* =================================
           CLEAR OLD MESSAGES
        ================================= */

        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";


        /* =================================
           PASSWORD CHECK
        ================================= */

        if (password !== confirmPassword) {

            errorMessage.textContent =
                "❌ Passwords do not match.";

            errorMessage.style.display =
                "block";

            return;

        }


        if (password.length < 6) {

            errorMessage.textContent =
                "❌ Password must contain at least 6 characters.";

            errorMessage.style.display =
                "block";

            return;

        }


        /* =================================
           BUTTON LOADING
        ================================= */

        createButton.disabled =
            true;

        createButton.textContent =
            "Creating Account...";


        try {


            console.log(
                "🔄 Sending signup request..."
            );


            /* =================================
               SUPABASE AUTH SIGNUP
            ================================= */

            const result =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name:
                                name

                        },

                        emailRedirectTo:
                            "https://govardhan1305.github.io/talent-exchange/login.html"

                    }

                });


            const data =
                result.data;

            const error =
                result.error;


            console.log(
                "Supabase response:",
                result
            );


            /* =================================
               HANDLE ERROR
            ================================= */

            if (error) {

                throw error;

            }


            /* =================================
               SAVE LOCAL PROFILE
            ================================= */

            const profile = {

                name: name,

                email: email,

                skill: "",

                learningSkill: "",

                bio: ""

            };


            localStorage.setItem(

                "userProfile",

                JSON.stringify(profile)

            );


            /* =================================
               SUCCESS MESSAGE
            ================================= */

            successMessage.innerHTML =

                "✅ Account created successfully!<br><br>" +

                "📧 Please check your email and verify your account.";


            successMessage.style.display =
                "block";


            createButton.textContent =
                "Account Created ✓";


            /* =================================
               REDIRECT TO LOGIN
            ================================= */

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 4000);


        }


        catch(error) {


            console.error(
                "❌ SUPABASE SIGNUP ERROR:",
                error
            );


            let errorText =
                error?.message ||
                "Unable to create account.";


            /* =================================
               FRIENDLY ERRORS
            ================================= */

            if (
                errorText
                .toLowerCase()
                .includes("failed to fetch")
            ) {

                errorText =
                    "❌ Failed to connect to Supabase. Please check your internet connection and try again.";

            }


            else if (
                errorText
                .toLowerCase()
                .includes("already registered")
            ) {

                errorText =
                    "❌ This email is already registered. Please login.";

            }


            else if (
                errorText
                .toLowerCase()
                .includes("password")
            ) {

                errorText =
                    "❌ Please use a stronger password.";

            }


            errorMessage.textContent =
                errorText;


            errorMessage.style.display =
                "block";


            createButton.disabled =
                false;


            createButton.textContent =
                "✨ Create New Account";


        }

    });


</script>


</body>

</html>
