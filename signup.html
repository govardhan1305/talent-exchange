<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;

    background:
        radial-gradient(circle at 15% 15%,#5b358d,transparent 32%),
        radial-gradient(circle at 85% 85%,#254e9d,transparent 32%),
        linear-gradient(135deg,#070711,#15132b);
}

.signup-container{
    width:90%;
    max-width:450px;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    font-size:48px;
}

.logo h1{
    font-size:30px;
}

.logo p{
    color:#aaa;
    margin-top:8px;
}

.signup-card{
    padding:32px;
    border-radius:24px;

    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

.signup-card h2{
    text-align:center;
    margin-bottom:25px;
    font-size:25px;
}

.input-group{
    margin-bottom:17px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px;

    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);

    outline:none;

    color:white;
    background:rgba(255,255,255,0.08);

    font-size:15px;
}

.input-group input:focus{
    border-color:#a786ff;
}

.create-btn{
    width:100%;
    padding:14px;
    margin-top:5px;

    border:none;
    border-radius:12px;

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(90deg,#8066ff,#bd82ff);
}

.create-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.message{
    display:none;

    margin-bottom:15px;
    padding:12px;

    border-radius:10px;

    text-align:center;
    font-size:14px;
}

.error{
    color:#ffaaaa;
    background:rgba(255,70,70,0.15);
}

.success{
    color:#9be6a5;
    background:rgba(70,200,120,0.15);
}

.login-text{
    text-align:center;
    margin-top:22px;
    color:#aaa;
    font-size:14px;
}

.login-link{
    display:block;
    margin-top:10px;

    text-align:center;

    color:#c9b7ff;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="signup-container">

    <div class="logo">

        <div class="logo-icon">
            ✨
        </div>

        <h1>Talent Exchange</h1>

        <p>Learn • Share • Connect</p>

    </div>


    <div class="signup-card">

        <h2>
            Create Your Account 🚀
        </h2>


        <div id="errorMessage"
             class="message error">
        </div>


        <div id="successMessage"
             class="message success">
        </div>


        <form id="signupForm">


            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required>

            </div>


            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                id="createButton"
                class="create-btn">

                ✨ Create New Account

            </button>

        </form>


        <div class="login-text">

            Already have an account?

        </div>


        <a href="login.html"
           class="login-link">

            ← Back to Login

        </a>

    </div>

</div>


<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
    "https://uigekrizjpypvxrpnzy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_zbxRmxoGjU8fqrv04QWahQ_QW36q2dh";


/* =====================================
   SIGNUP
===================================== */

document
.getElementById("signupForm")
.addEventListener("submit", async function(event){

    event.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");

    const button =
        document.getElementById("createButton");


    errorMessage.style.display = "none";
    successMessage.style.display = "none";


    /* PASSWORD CHECK */

    if(password !== confirmPassword){

        errorMessage.textContent =
            "❌ Passwords do not match.";

        errorMessage.style.display = "block";

        return;
    }


    if(password.length < 6){

        errorMessage.textContent =
            "❌ Password must be at least 6 characters.";

        errorMessage.style.display = "block";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try{

        /* =====================================
           DIRECT SUPABASE AUTH REQUEST
        ===================================== */

        const response = await fetch(

            SUPABASE_URL + "/auth/v1/signup",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY

                },

                body: JSON.stringify({

                    email: email,

                    password: password,

                    data: {

                        full_name: name

                    }

                })

            }

        );


        const result =
            await response.json();


        console.log(
            "Supabase response:",
            result
        );


        /* =====================================
           ERROR
        ===================================== */

        if(!response.ok){

            throw new Error(

                result.msg ||
                result.message ||
                result.error_description ||
                "Signup failed."

            );

        }


        /* =====================================
           SUCCESS
        ===================================== */

        successMessage.innerHTML =
            "✅ Account created successfully!<br><br>" +
            "📧 Check your email to verify your account.";

        successMessage.style.display =
            "block";


        button.textContent =
            "Account Created ✓";


        /* SAVE PROFILE NAME */

        localStorage.setItem(

            "userProfile",

            JSON.stringify({

                name:name,

                email:email,

                skill:"",

                learningSkill:"",

                bio:""

            })

        );


        /* REDIRECT */

        setTimeout(function(){

            window.location.href =
                "login.html";

        },4000);


    }

    catch(error){

        console.error(
            "SIGNUP ERROR:",
            error
        );


        errorMessage.textContent =
            "❌ " + error.message;


        errorMessage.style.display =
            "block";


        button.disabled =
            false;


        button.textContent =
            "✨ Create New Account";

    }

});

</script>

</body>

</html>
