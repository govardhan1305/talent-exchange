<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Talent Exchange</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    background:
        radial-gradient(circle at 15% 15%, #5b358d, transparent 32%),
        radial-gradient(circle at 85% 85%, #254e9d, transparent 32%),
        linear-gradient(135deg, #070711, #15132b);
}

.signup-container {
    width: 90%;
    max-width: 450px;
    padding: 20px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icon {
    font-size: 48px;
    margin-bottom: 8px;
}

.logo h1 {
    font-size: 30px;
}

.logo p {
    color: #aaa;
    margin-top: 8px;
}

.signup-card {
    padding: 32px;

    border-radius: 24px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(18px);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
}

.signup-card h2 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 25px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    color: #ddd;
    font-size: 14px;
}

.input-group input {
    width: 100%;
    padding: 14px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,0.12);

    outline: none;

    color: white;

    background:
        rgba(255,255,255,0.08);

    font-size: 15px;
}

.input-group input:focus {
    border-color: #a786ff;

    background:
        rgba(255,255,255,0.11);
}

.create-btn {
    width: 100%;

    padding: 14px;

    margin-top: 5px;

    border: none;

    border-radius: 12px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #8066ff,
            #bd82ff
        );

    transition: 0.3s;
}

.create-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(128,102,255,0.3);
}

.message {
    display: none;

    margin-bottom: 15px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    font-size: 14px;
}

.error {
    color: #ffaaaa;

    background:
        rgba(255,70,70,0.12);
}

.success {
    color: #9be6a5;

    background:
        rgba(70,200,120,0.15);
}

.login-text {
    text-align: center;

    margin-top: 22px;

    color: #aaa;

    font-size: 14px;
}

.login-link {
    display: block;

    margin-top: 10px;

    text-align: center;

    color: #c9b7ff;

    text-decoration: none;

    font-weight: bold;
}

.login-link:hover {
    text-decoration: underline;
}

@media(max-width:500px) {

    .signup-card {
        padding: 25px 20px;
    }

    .logo h1 {
        font-size: 26px;
    }
}

</style>

</head>


<body>


<div class="signup-container">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            ✨
        </div>

        <h1>
            Talent Exchange
        </h1>

        <p>
            Learn • Share • Connect
        </p>

    </div>


    <!-- SIGNUP CARD -->

    <div class="signup-card">

        <h2>
            Create Your Account 🚀
        </h2>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="message error"
        ></div>


        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="message success"
        >
            ✅ Account created successfully!
            <br>
            Redirecting to Login...
        </div>


        <form
            onsubmit="createAccount(event)"
        >


            <!-- NAME -->

            <div class="input-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                    minlength="6"
                >

            </div>


            <!-- CREATE -->

            <button
                type="submit"
                class="create-btn"
                id="createButton"
            >
                ✨ Create New Account
            </button>


        </form>


        <div class="login-text">

            Already have an account?

        </div>


        <a
            href="login.html"
            class="login-link"
        >
            ← Back to Login
        </a>


    </div>


</div>


<script>

function createAccount(event) {

    event.preventDefault();


    const name =
        document.getElementById("name")
        .value.trim();


    const email =
        document.getElementById("email")
        .value.trim();


    const password =
        document.getElementById("password")
        .value;


    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const successMessage =
        document.getElementById(
            "successMessage"
        );


    const createButton =
        document.getElementById(
            "createButton"
        );


    /* Hide previous error */

    errorMessage.style.display = "none";


    /* Check password */

    if (password !== confirmPassword) {

        errorMessage.textContent =
            "❌ Passwords do not match.";

        errorMessage.style.display =
            "block";

        return;
    }


    /* Check password length */

    if (password.length < 6) {

        errorMessage.textContent =
            "❌ Password must contain at least 6 characters.";

        errorMessage.style.display =
            "block";

        return;
    }


    /*
      TEMPORARY ACCOUNT DATA

      Tomorrow this will be replaced
      with Supabase authentication.
    */

    const account = {

        name: name,

        email: email,

        password: password

    };


    localStorage.setItem(
        "userAccount",
        JSON.stringify(account)
    );


    /*
      Also create the profile so
      Dashboard can use the name.
    */

    const profile = {

        name: name,

        email: email,

        skill: "",

        learningSkill: "",

        bio: ""

    };


    localStorage.setItem(
        "userProfile",
        JSON.stringify(profile)
    );


    /* Show success */

    successMessage.style.display =
        "block";


    createButton.disabled = true;


    createButton.textContent =
        "Account Created ✓";


    /* Go to login */

    setTimeout(function() {

        window.location.href =
            "login.html";

    }, 2000);

}

</script>


</body>

</html>
