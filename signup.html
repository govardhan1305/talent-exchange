<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;

    background:
    radial-gradient(circle at 15% 15%,#5b358d,transparent 32%),
    radial-gradient(circle at 85% 85%,#254e9d,transparent 32%),
    linear-gradient(135deg,#070711,#15132b);
}

.signup-container{
    width:90%;
    max-width:450px;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    font-size:48px;
    margin-bottom:8px;
}

.logo h1{
    font-size:30px;
}

.logo p{
    color:#aaa;
    margin-top:8px;
}

.signup-card{
    padding:32px;
    border-radius:24px;

    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

.signup-card h2{
    text-align:center;
    margin-bottom:25px;
    font-size:25px;
}

.input-group{
    margin-bottom:17px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px;

    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);

    outline:none;

    color:white;
    background:rgba(255,255,255,0.08);

    font-size:15px;
}

.input-group input:focus{
    border-color:#a786ff;
    background:rgba(255,255,255,0.11);
}

.create-btn{
    width:100%;
    padding:14px;
    margin-top:5px;

    border:none;
    border-radius:12px;

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(90deg,#8066ff,#bd82ff);

    transition:0.3s;
}

.create-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(128,102,255,0.3);
}

.create-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:15px;
    padding:13px;

    border-radius:10px;
    text-align:center;

    font-size:14px;
    line-height:1.5;
}

.error{
    color:#ffb0b0;
    background:rgba(255,70,70,0.15);
}

.success{
    color:#a8f0b0;
    background:rgba(70,200,120,0.15);
}

.login-text{
    text-align:center;
    margin-top:22px;

    color:#aaa;
    font-size:14px;
}

.login-link{
    display:block;
    margin-top:10px;

    text-align:center;

    color:#c9b7ff;
    text-decoration:none;
    font-weight:bold;
}

.login-link:hover{
    text-decoration:underline;
}

@media(max-width:500px){

    .signup-card{
        padding:25px 20px;
    }

    .logo h1{
        font-size:26px;
    }

}

</style>

</head>

<body>

<div class="signup-container">

    <div class="logo">

        <div class="logo-icon">
            ✨
        </div>

        <h1>
            Talent Exchange
        </h1>

        <p>
            Learn • Share • Connect
        </p>

    </div>


    <div class="signup-card">

        <h2>
            Create Your Account 🚀
        </h2>


        <div
            id="errorMessage"
            class="message error">
        </div>


        <div
            id="successMessage"
            class="message success">
        </div>


        <form id="signupForm">

            <div class="input-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                class="create-btn"
                id="createButton">

                ✨ Create New Account

            </button>

        </form>


        <div class="login-text">

            Already have an account?

        </div>


        <a
            href="login.html"
            class="login-link">

            ← Back to Login

        </a>

    </div>

</div>


<script>

/*
====================================================
TALENT EXCHANGE - SIGNUP
====================================================

Supabase has been completely removed.

The form will connect to our Python Flask
backend after the backend is created.

Expected API:

POST /api/signup

Data sent:

{
    name: "...",
    email: "...",
    password: "..."
}

====================================================
*/


const signupForm =
    document.getElementById("signupForm");


signupForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const name =
            document.getElementById("name")
            .value
            .trim();


        const email =
            document.getElementById("email")
            .value
            .trim();


        const password =
            document.getElementById("password")
            .value;


        const confirmPassword =
            document.getElementById("confirmPassword")
            .value;


        const errorMessage =
            document.getElementById("errorMessage");


        const successMessage =
            document.getElementById("successMessage");


        const createButton =
            document.getElementById("createButton");


        errorMessage.style.display = "none";
        successMessage.style.display = "none";


        /*
        PASSWORD CHECK
        */

        if(password !== confirmPassword){

            errorMessage.textContent =
                "❌ Passwords do not match.";

            errorMessage.style.display =
                "block";

            return;
        }


        /*
        PASSWORD LENGTH
        */

        if(password.length < 6){

            errorMessage.textContent =
                "❌ Password must contain at least 6 characters.";

            errorMessage.style.display =
                "block";

            return;
        }


        /*
        BUTTON LOADING
        */

        createButton.disabled = true;

        createButton.textContent =
            "Creating Account...";


        try{

            /*
            ============================================
            PYTHON BACKEND
            ============================================

            Backend URL will be added after we
            create and deploy Flask.

            Example:

            https://your-backend.onrender.com/api/signup

            ============================================
            */


            const response =
                await fetch(
                    "YOUR_PYTHON_BACKEND_URL/api/signup",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                name: name,

                                email: email,

                                password: password

                            })

                    }
                );


            const result =
                await response.json();


            if(!response.ok){

                throw new Error(
                    result.message ||
                    "Account creation failed."
                );

            }


            /*
            SUCCESS
            */

            successMessage.innerHTML =
                "✅ Account created successfully!<br>" +
                "Redirecting to Login...";


            successMessage.style.display =
                "block";


            createButton.textContent =
                "Account Created ✓";


            /*
            Save only temporary UI information.
            Password is NEVER stored here.
            */

            localStorage.setItem(
                "userProfile",
                JSON.stringify({

                    name: name,

                    email: email,

                    skill: "",

                    learningSkill: "",

                    bio: ""

                })
            );


            /*
            REDIRECT
            */

            setTimeout(function(){

                window.location.href =
                    "login.html";

            },2000);


        }

        catch(error){

            console.error(
                "Signup Error:",
                error
            );


            errorMessage.textContent =
                "❌ " +
                (
                    error.message ||
                    "Unable to connect to server."
                );


            errorMessage.style.display =
                "block";


            createButton.disabled =
                false;


            createButton.textContent =
                "✨ Create New Account";

        }

    }
);

</script>

</body>

</html>
