<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Talent Exchange</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #090916, #24164d, #11112b);
            color: white;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #9b7cff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #8b6cff, #c084fc);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .register a {
            color: #b69cff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">✨ Talent Exchange</div>

        <p class="subtitle">
            Welcome back! Login to continue.
        </p>

        <form onsubmit="loginUser(event)">

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login 🚀
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

    </div>

    <script>
        function loginUser(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;

            const savedEmail = localStorage.getItem("userEmail");

            if (email === savedEmail) {
                alert("Login successful! 🎉");
                window.location.href = "dashboard.html";
            } else {
                alert("Account not found. Please register first.");
            }
        }
    </script>

</body>
</html>
