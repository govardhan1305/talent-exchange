<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;

    background:
    radial-gradient(circle at 15% 15%,#5b358d,transparent 32%),
    radial-gradient(circle at 85% 85%,#254e9d,transparent 32%),
    linear-gradient(135deg,#070711,#15132b);
}

.login-container{
    width:90%;
    max-width:430px;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    font-size:48px;
    margin-bottom:8px;
}

.logo h1{
    font-size:30px;
}

.logo p{
    color:#aaa;
    margin-top:8px;
}

.login-card{
    padding:32px;
    border-radius:24px;

    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    box-shadow:0 20px 60px rgba(0,0,0,0.35);
}

.login-card h2{
    text-align:center;
    margin-bottom:25px;
    font-size:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px;

    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);

    outline:none;

    color:white;
    background:rgba(255,255,255,0.08);

    font-size:15px;
}

.input-group input:focus{
    border-color:#a786ff;
    background:rgba(255,255,255,0.11);
}

.login-btn{
    width:100%;
    padding:14px;
    margin-top:5px;

    border:none;
    border-radius:12px;

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(90deg,#8066ff,#bd82ff);

    transition:0.3s;
}

.login-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(128,102,255,0.3);
}

.login-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
    transform:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;

    margin:25px 0;

    color:#777;
    font-size:13px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;

    background:
        rgba(255,255,255,0.12);
}

.signup-text{
    text-align:center;

    color:#aaa;
    font-size:14px;
}

.signup-btn{
    display:block;
    width:100%;

    margin-top:12px;
    padding:13px;

    text-align:center;
    text-decoration:none;

    color:white;

    border-radius:12px;

    border:
        1px solid rgba(255,255,255,0.15);

    background:
        rgba(255,255,255,0.06);

    transition:0.3s;
}

.signup-btn:hover{
    background:
        rgba(255,255,255,0.13);
}

.error-message{
    display:none;

    margin-bottom:15px;
    padding:12px;

    border-radius:10px;

    text-align:center;

    color:#ffaaaa;

    background:
        rgba(255,70,70,0.12);
}

.success-message{
    display:none;

    margin-bottom:15px;
    padding:12px;

    border-radius:10px;

    text-align:center;

    color:#9be6a5;

    background:
        rgba(70,200,120,0.15);
}

@media(max-width:500px){

    .login-card{
        padding:25px 20px;
    }

    .logo h1{
        font-size:26px;
    }

}

</style>

</head>


<body>

<div class="login-container">

    <div class="logo">

        <div class="logo-icon">
            ✨
        </div>

        <h1>
            Talent Exchange
        </h1>

        <p>
            Learn • Share • Connect
        </p>

    </div>


    <div class="login-card">

        <h2>
            Welcome Back 👋
        </h2>


        <div
            class="error-message"
            id="errorMessage">
        </div>


        <div
            class="success-message"
            id="successMessage">
        </div>


        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                🔐 Login

            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <div class="signup-text">

            Don't have an account?

        </div>


        <!-- IMPORTANT:
             Your signup page is register.html -->

        <a
            href="register.html"
            class="signup-btn">

            ✨ Create New Account

        </a>

    </div>

</div>


<script>


// ==========================================
// BACKEND URL
// ==========================================

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


// ==========================================
// LOGIN
// ==========================================

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        // Get values

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =
            document
            .getElementById("password")
            .value;


        const error =
            document
            .getElementById("errorMessage");


        const success =
            document
            .getElementById("successMessage");


        const loginButton =
            document
            .getElementById("loginButton");


        // Clear messages

        error.style.display =
            "none";

        success.style.display =
            "none";


        // Disable button

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        try{


            // ==================================
            // SEND LOGIN REQUEST
            // ==================================

            const response =
                await fetch(

                    BACKEND_URL +
                    "/api/login",

                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                            "application/json"
                        },

                        body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                    }

                );


            // Get backend response

            const result =
                await response.json();


            // ==================================
            // LOGIN FAILED
            // ==================================

            if(!response.ok){

                throw new Error(

                    result.message ||
                    "Invalid email or password."

                );

            }


            // ==================================
            // LOGIN SUCCESS
            // ==================================

            if(result.success){


                // Login status

                localStorage.setItem(
                    "loggedIn",
                    "true"
                );


                // Current user email

                localStorage.setItem(
                    "currentUser",
                    email
                );


                // Save user profile

                if(result.user){

                    localStorage.setItem(

                        "userProfile",

                        JSON.stringify({

                            id:
                                result.user.id || "",

                            name:
                                result.user.name || "",

                            email:
                                result.user.email ||
                                email,

                            skill:
                                result.user.skill || "",

                            learningSkill:
                                result.user.learningSkill ||
                                "",

                            bio:
                                result.user.bio || ""

                        })

                    );

                }


                // Success message

                success.textContent =
                    "✅ Login successful! Redirecting...";


                success.style.display =
                    "block";


                loginButton.textContent =
                    "Login Successful ✓";


                // ==================================
                // REDIRECT TO DASHBOARD
                // ==================================

                setTimeout(

                    function(){

                        window.location.href =
                            "dashboard.html";

                    },

                    1000

                );

            }


        }

        catch(errorObject){


            console.error(
                "Login Error:",
                errorObject
            );


            error.textContent =
                "❌ " +
                (
                    errorObject.message ||
                    "Unable to connect to server."
                );


            error.style.display =
                "block";


            loginButton.disabled =
                false;


            loginButton.textContent =
                "🔐 Login";

        }

    }

);

</script>

</body>

</html>
