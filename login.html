<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Exchange - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #4f46e5, #7c3aed);
      overflow: hidden;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      text-align: center;
      color: white;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #ddd;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      outline: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 16px;
    }

    input::placeholder {
      color: #ddd;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #4f46e5;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.03);
      background: #e0e7ff;
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🤝</div>

    <h1>Talent Exchange</h1>

    <p class="subtitle">
      Share Skills • Learn • Connect
    </p>

    <form id="loginForm">

      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login 🚀
      </button>

    </form>

    <p id="message"></p>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      if (username !== "" && password !== "") {

        message.style.color = "#86efac";
        message.textContent = "Login successful! 🚀";

        setTimeout(() => {
          window.location.href = "profile.html";
        }, 1000);

      } else {

        message.style.color = "#fca5a5";
        message.textContent = "Please enter all details.";

      }

    });
  </script>

</body>
</html>
