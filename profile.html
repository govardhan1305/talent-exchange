<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Talent Exchange</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    color: white;

    background:
        radial-gradient(
            circle at 10% 10%,
            #58348c,
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 80%,
            #244c9b,
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #070711,
            #15132b
        );
}


/* NAVBAR */

.navbar {

    min-height: 72px;

    padding: 12px 6%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(10,10,20,0.78);

    border-bottom:
        1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(18px);

}


.logo {

    font-size: 21px;

    font-weight: bold;

}


.back {

    color: white;

    text-decoration: none;

    padding: 10px 16px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);

}


/* PROFILE */

.container {

    width: 90%;

    max-width: 650px;

    margin: 50px auto;

}


.heading {

    text-align: center;

    margin-bottom: 30px;

}


.heading h1 {

    font-size: 40px;

    margin-bottom: 10px;

    background:
        linear-gradient(
            90deg,
            white,
            #c49cff
        );

    -webkit-background-clip: text;

    color: transparent;

}


.heading p {

    color: #aaa;

}


/* CARD */

.profile-card {

    padding: 30px;

    border-radius: 24px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(18px);

}


/* AVATAR */

.avatar {

    width: 85px;

    height: 85px;

    margin: 0 auto 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #8066ff,
            #bd82ff
        );

}


/* FORM */

.form-group {

    margin-bottom: 20px;

}


.form-group label {

    display: block;

    margin-bottom: 8px;

    color: #ddd;

    font-size: 14px;

}


.form-group input,
.form-group textarea {

    width: 100%;

    padding: 14px 15px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,0.12);

    outline: none;

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 15px;

}


.form-group textarea {

    min-height: 110px;

    resize: vertical;

}


.form-group input:focus,
.form-group textarea:focus {

    border-color: #a985ff;

    background:
        rgba(255,255,255,0.10);

}


/* SAVE BUTTON */

.save-btn {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            #8066ff,
            #bd82ff
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;

}


.save-btn:hover {

    transform:
        translateY(-2px);

}


/* SUCCESS */

.success-message {

    display: none;

    margin-top: 20px;

    padding: 15px;

    text-align: center;

    border-radius: 12px;

    background:
        rgba(70,200,120,0.15);

    border:
        1px solid rgba(70,200,120,0.25);

    color: #9be6a5;

}


/* MOBILE */

@media(max-width:600px) {

    .heading h1 {

        font-size: 32px;

    }

    .profile-card {

        padding: 22px;

    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</nav>



<main class="container">


    <div class="heading">

        <h1>
            My Profile 👤
        </h1>

        <p>
            Tell people about yourself and your skills.
        </p>

    </div>



    <div class="profile-card">


        <div class="avatar">
            👤
        </div>


        <form
            onsubmit="saveProfile(event)"
        >


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- SKILL -->

            <div class="form-group">

                <label>
                    Skill You Offer
                </label>

                <input
                    type="text"
                    id="skill"
                    placeholder="Example: Python, Video Editing, Guitar"
                    required
                >

            </div>



            <!-- BIO -->

            <div class="form-group">

                <label>
                    About You
                </label>

                <textarea
                    id="bio"
                    placeholder="Tell people a little about yourself..."
                ></textarea>

            </div>



            <!-- SAVE -->

            <button
                type="submit"
                class="save-btn"
            >

                💾 Save Profile

            </button>


        </form>



        <!-- SUCCESS MESSAGE -->

        <div
            class="success-message"
            id="successMessage"
        >

            ✅ Profile saved successfully!

            <br>

            <small>
                Redirecting to Dashboard...
            </small>

        </div>


    </div>


</main>



<script>


/* LOAD EXISTING PROFILE */

function loadProfile() {

    const savedProfile =
        localStorage.getItem(
            "userProfile"
        );


    if (!savedProfile) {
        return;
    }


    const profile =
        JSON.parse(
            savedProfile
        );


    document.getElementById("name").value =
        profile.name || "";


    document.getElementById("email").value =
        profile.email || "";


    document.getElementById("skill").value =
        profile.skill || "";


    document.getElementById("bio").value =
        profile.bio || "";

}


/* SAVE PROFILE */

function saveProfile(event) {

    event.preventDefault();


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const skill =
        document.getElementById(
            "skill"
        ).value.trim();


    const bio =
        document.getElementById(
            "bio"
        ).value.trim();


    /* PROFILE OBJECT */

    const profile = {

        name: name,

        email: email,

        skill: skill,

        bio: bio

    };


    /* SAVE */

    localStorage.setItem(

        "userProfile",

        JSON.stringify(profile)

    );


    /* SUCCESS MESSAGE */

    const message =
        document.getElementById(
            "successMessage"
        );


    message.style.display =
        "block";


    /* DISABLE BUTTON */

    const button =
        document.querySelector(
            ".save-btn"
        );


    button.disabled = true;

    button.textContent =
        "✅ Profile Saved";


    /* REDIRECT AFTER 3 SECONDS */

    setTimeout(
        function() {

            window.location.href =
                "dashboard.html";

        },
        3000
    );

}


/* LOAD PROFILE WHEN PAGE OPENS */

loadProfile();


</script>


</body>

</html>
