<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;

    background:
        radial-gradient(circle at 10% 10%,#58348c,transparent 30%),
        radial-gradient(circle at 90% 80%,#244c9b,transparent 30%),
        linear-gradient(135deg,#070711,#15132b);
}

.navbar{
    min-height:72px;
    padding:12px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(10,10,20,0.78);
    border-bottom:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(18px);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
}

.container{
    width:90%;
    max-width:650px;
    margin:50px auto;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.heading h1{
    font-size:40px;
    margin-bottom:10px;

    background:linear-gradient(90deg,white,#c49cff);
    -webkit-background-clip:text;
    color:transparent;
}

.heading p{
    color:#aaa;
}

.profile-card{
    padding:30px;
    border-radius:24px;

    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(18px);
}

.avatar{
    width:85px;
    height:85px;
    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    font-size:38px;

    background:linear-gradient(135deg,#8066ff,#bd82ff);
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:14px 15px;

    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);

    outline:none;

    background:rgba(255,255,255,0.08);
    color:white;

    font-size:15px;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.save-btn{
    width:100%;
    padding:15px;

    border:none;
    border-radius:13px;

    background:linear-gradient(90deg,#8066ff,#bd82ff);

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.save-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:20px;
    padding:15px;

    text-align:center;
    border-radius:12px;
}

.success{
    background:rgba(70,200,120,0.15);
    color:#9be6a5;
}

.error{
    background:rgba(255,70,70,0.15);
    color:#ffaaaa;
}

@media(max-width:600px){

    .heading h1{
        font-size:32px;
    }

    .profile-card{
        padding:22px;
    }

}

</style>
</head>


<body>


<nav class="navbar">

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</nav>


<main class="container">

    <div class="heading">

        <h1>
            My Profile 👤
        </h1>

        <p>
            Tell people about yourself and your skills.
        </p>

    </div>


    <div class="profile-card">

        <div class="avatar">
            👤
        </div>


        <form id="profileForm">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Skill You Offer
                </label>

                <input
                    type="text"
                    id="skill"
                    placeholder="Example: Python, Guitar"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Learning Skill
                </label>

                <input
                    type="text"
                    id="learningSkill"
                    placeholder="What do you want to learn?"
                >

            </div>


            <div class="form-group">

                <label>
                    About You
                </label>

                <textarea
                    id="bio"
                    placeholder="Tell people a little about yourself..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="save-btn"
                id="saveButton"
            >
                💾 Save Profile
            </button>

        </form>


        <div
            class="message success"
            id="successMessage"
        >
            ✅ Profile updated successfully!
        </div>


        <div
            class="message error"
            id="errorMessage"
        >
        </div>

    </div>

</main>


<script>

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


/* ==========================================
   LOAD PROFILE
========================================== */

function loadProfile(){

    const savedProfile =
        localStorage.getItem("userProfile");

    if(!savedProfile){
        return;
    }

    try{

        const profile =
            JSON.parse(savedProfile);

        document.getElementById("name").value =
            profile.name || "";

        document.getElementById("email").value =
            profile.email || "";

        document.getElementById("skill").value =
            profile.skill || "";

        document.getElementById("learningSkill").value =
            profile.learningSkill || "";

        document.getElementById("bio").value =
            profile.bio || "";

    }catch(error){

        console.error(
            "Profile load error:",
            error
        );

    }

}


/* ==========================================
   SAVE PROFILE
========================================== */

document
.getElementById("profileForm")
.addEventListener("submit", async function(event){

    event.preventDefault();

    const name =
        document.getElementById("name")
        .value
        .trim();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const skill =
        document.getElementById("skill")
        .value
        .trim();

    const learningSkill =
        document.getElementById("learningSkill")
        .value
        .trim();

    const bio =
        document.getElementById("bio")
        .value
        .trim();


    const savedProfile =
        localStorage.getItem("userProfile");


    if(!savedProfile){

        showError(
            "User profile not found. Please login again."
        );

        return;

    }


    let profile;

    try{

        profile =
            JSON.parse(savedProfile);

    }catch(error){

        showError(
            "Invalid profile data. Please login again."
        );

        return;

    }


    const userId =
        profile.id;


    if(!userId){

        showError(
            "User ID not found. Please logout and login again."
        );

        return;

    }


    const saveButton =
        document.getElementById("saveButton");


    saveButton.disabled = true;

    saveButton.textContent =
        "Saving...";


    hideMessages();


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/api/users/" +
                userId,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        name:name,

                        email:email,

                        skill:skill,

                        learningSkill:
                            learningSkill,

                        bio:bio

                    })

                }
            );


        const result =
            await response.json();


        if(!response.ok){

            throw new Error(
                result.message ||
                "Unable to update profile."
            );

        }


        /* UPDATE LOCAL STORAGE */

        if(result.user){

            localStorage.setItem(
                "userProfile",
                JSON.stringify({

                    id:
                        result.user.id,

                    name:
                        result.user.name,

                    email:
                        result.user.email,

                    skill:
                        result.user.skill,

                    learningSkill:
                        result.user.learningSkill,

                    bio:
                        result.user.bio

                })
            );

        }


        showSuccess();


        saveButton.textContent =
            "✅ Profile Saved";


        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },1500);


    }catch(error){

        console.error(
            "Profile update error:",
            error
        );


        showError(
            "❌ " +
            (
                error.message ||
                "Unable to connect to server."
            )
        );


        saveButton.disabled =
            false;

        saveButton.textContent =
            "💾 Save Profile";

    }

});


/* ==========================================
   SUCCESS
========================================== */

function showSuccess(){

    const message =
        document.getElementById(
            "successMessage"
        );

    message.style.display =
        "block";

}


/* ==========================================
   ERROR
========================================== */

function showError(text){

    const message =
        document.getElementById(
            "errorMessage"
        );

    message.textContent =
        text;

    message.style.display =
        "block";

}


function hideMessages(){

    document.getElementById(
        "successMessage"
    ).style.display =
        "none";

    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}


/* LOAD */

loadProfile();

</script>

</body>

</html>
