<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Connections | Talent Exchange</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:
    radial-gradient(circle at top right,#3b2470,transparent 35%),
    linear-gradient(135deg,#080812,#15112b);
}

nav{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    background:rgba(10,10,20,.8);
    border-bottom:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;
}

.container{
    width:90%;
    max-width:1100px;
    margin:45px auto;
}

.heading{
    text-align:center;
    margin-bottom:35px;
}

.heading h1{
    font-size:40px;
    margin-bottom:10px;
}

.heading p{
    color:#aaa;
}

.connections{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    padding:25px;
    border-radius:22px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.1);
}

.avatar{
    width:65px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,#8066ff,#bd82ff);
    font-size:30px;
    margin-bottom:18px;
}

.card h2{
    margin-bottom:7px;
}

.card p{
    color:#aaa;
    margin-bottom:12px;
}

.skill{
    display:inline-block;
    padding:7px 12px;
    margin-bottom:16px;
    border-radius:20px;
    background:rgba(150,120,255,.2);
    color:#c9baff;
    font-size:13px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:#6ee77d;
    font-size:13px;
    margin-bottom:18px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#4caf50;
}

.chat-button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#8066ff,#bd82ff);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.chat-button:hover{
    transform:translateY(-2px);
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#aaa;
}

.empty h2{
    color:white;
    margin-bottom:10px;
}

.find-button{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    border-radius:12px;
    background:linear-gradient(90deg,#8066ff,#bd82ff);
    color:white;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:900px){

    .connections{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .connections{
        grid-template-columns:1fr;
    }

    .heading h1{
        font-size:30px;
    }

}

</style></head><body><nav><div class="logo">
    ✨ Talent Exchange
</div>

<a href="dashboard.html" class="back">
    ← Dashboard
</a>

</nav><div class="container"><div class="heading">

    <h1>
        My Connections 🤝
    </h1>

    <p>
        People you connected with through Talent Exchange.
    </p>

</div>


<div
    class="connections"
    id="connections"
></div>

</div><script>


const defaultPeople = [

    {
        name:"Arjun",
        skill:"Python",
        emoji:"👨‍💻"
    },

    {
        name:"Rahul",
        skill:"Guitar",
        emoji:"🎸"
    },

    {
        name:"Priya",
        skill:"Video Editing",
        emoji:"🎬"
    },

    {
        name:"Neha",
        skill:"Graphic Design",
        emoji:"🎨"
    },

    {
        name:"Vikram",
        skill:"Web Development",
        emoji:"💻"
    },

    {
        name:"Sneha",
        skill:"Photography",
        emoji:"📸"
    }

];


function loadConnections(){

    const box =
        document.getElementById(
            "connections"
        );


    let savedConnections =

        JSON.parse(

            localStorage.getItem(
                "myConnections"
            ) || "[]"

        );


    /*
       If accepted connections exist,
       show only those.
    */

    let people = savedConnections;


    /*
       Prototype fallback:
       If no accepted connection exists,
       show demo connection.
    */

    if(people.length === 0){

        people = [

            {
                name:"Arjun",
                skill:"Python",
                emoji:"👨‍💻"
            }

        ];

    }


    box.innerHTML = "";


    people.forEach(person => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        card.innerHTML = `

            <div class="avatar">

                ${person.emoji || "🤝"}

            </div>


            <h2>

                ${escapeHTML(person.name)}

            </h2>


            <p>

                ${escapeHTML(person.skill)}

            </p>


            <span class="skill">

                ${escapeHTML(person.skill)}

            </span>


            <div class="status">

                <span class="dot"></span>

                Connected

            </div>


            <button
                class="chat-button"
                onclick="openChat(
                    '${escapeJS(person.name)}',
                    '${escapeJS(person.skill)}'
                )"
            >

                💬 Chat with
                ${escapeHTML(person.name)}

            </button>

        `;


        box.appendChild(card);

    });

}


function openChat(name,skill){

    localStorage.setItem(
        "activeChatName",
        name
    );

    localStorage.setItem(
        "activeChatSkill",
        skill
    );


    window.location.href =
        "chat.html";

}


function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


function escapeJS(text){

    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


loadConnections();

</script></body></html>
