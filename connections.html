<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Connections | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    color:white;

    background:
    radial-gradient(
        circle at 10% 10%,
        #59338d,
        transparent 30%
    ),

    radial-gradient(
        circle at 90% 80%,
        #254d9c,
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #070711,
        #15132b
    );
}


/* =========================
   NAVBAR
========================= */

.navbar{

    min-height:72px;

    padding:15px 6%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
    rgba(10,10,20,.85);

    border-bottom:
    1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(18px);
}

.logo{

    font-size:21px;
    font-weight:bold;

}

.back{

    color:white;

    text-decoration:none;

    padding:10px 16px;

    border-radius:10px;

    background:
    rgba(255,255,255,.08);
}

.back:hover{

    background:
    rgba(255,255,255,.15);

}


/* =========================
   MAIN
========================= */

.container{

    width:90%;

    max-width:1000px;

    margin:45px auto;

}

.heading{

    text-align:center;

    margin-bottom:35px;

}

.heading h1{

    font-size:40px;

    margin-bottom:10px;

    background:
    linear-gradient(
        90deg,
        #ffffff,
        #c49cff
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.heading p{

    color:#aaa;

}


/* =========================
   STATUS
========================= */

#status{

    text-align:center;

    color:#aaa;

    padding:25px;

}


/* =========================
   CONNECTIONS
========================= */

.connections{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:20px;

}


/* =========================
   CARD
========================= */

.connection-card{

    padding:25px;

    border-radius:21px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);

    transition:.3s;

}

.connection-card:hover{

    transform:translateY(-5px);

    background:
    rgba(255,255,255,.10);

}


/* =========================
   USER
========================= */

.user{

    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:20px;

}

.avatar{

    width:60px;

    height:60px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    font-size:27px;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );
}

.user h2{

    font-size:20px;

    margin-bottom:5px;

}

.user p{

    color:#aaa;

    font-size:14px;

}


/* =========================
   SKILLS
========================= */

.skills{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-bottom:20px;

}

.skill{

    padding:8px 12px;

    border-radius:20px;

    color:#d7caff;

    background:
    rgba(130,100,255,.2);

    font-size:13px;

}


/* =========================
   CHAT BUTTON
========================= */

.chat-btn{

    width:100%;

    padding:13px;

    border:none;

    border-radius:11px;

    color:white;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

    font-weight:bold;

    font-size:15px;

    cursor:pointer;

    transition:.3s;
}

.chat-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 8px 20px
    rgba(128,102,255,.25);

}


/* =========================
   ERROR
========================= */

.error{

    display:none;

    padding:15px;

    margin-bottom:20px;

    border-radius:12px;

    text-align:center;

    color:#ffaaaa;

    background:
    rgba(255,70,70,.12);
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .connections{

        grid-template-columns:1fr;

    }

    .heading h1{

        font-size:32px;

    }

    .container{

        width:94%;

    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</nav>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <div class="heading">

        <h1>
            My Connections 🤝
        </h1>

        <p>
            People you connected with through Talent Exchange.
        </p>

    </div>


    <div
        id="error"
        class="error">
    </div>


    <div id="status">
        🔄 Loading connections...
    </div>


    <div
        id="connections"
        class="connections">
    </div>


</main>


<script>


/* =====================================================
   BACKEND
===================================================== */

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


/* =====================================================
   CURRENT USER
===================================================== */

function getCurrentUser(){

    try{

        return JSON.parse(

            localStorage.getItem(
                "userProfile"
            ) || "{}"

        );

    }

    catch(error){

        console.error(
            "USER PROFILE ERROR:",
            error
        );

        return {};

    }

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(
    personId,
    personName,
    personSkill
){

    console.log(
        "Opening chat with USER ID:",
        personId
    );

    /*
    IMPORTANT FIX

    personId MUST be the OTHER USER'S ID.

    Backend connections response contains:

        connection.id
            = connection table ID

        connection.other_user_id
            = actual user ID

    We must use other_user_id.
    */

    localStorage.setItem(
        "activeChatId",
        String(personId)
    );


    localStorage.setItem(
        "activeChatName",
        personName
    );


    localStorage.setItem(
        "activeChatSkill",
        personSkill || ""
    );


    console.log(
        "ACTIVE CHAT ID SAVED:",
        localStorage.getItem(
            "activeChatId"
        )
    );


    window.location.href =
        "chat.html";

}


/* =====================================================
   LOAD CONNECTIONS
===================================================== */

async function loadConnections(){

    const user =
        getCurrentUser();


    const status =
        document.getElementById(
            "status"
        );


    const container =
        document.getElementById(
            "connections"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    container.innerHTML =
        "";

    errorBox.style.display =
        "none";


    if(!user.id){

        status.innerHTML =
            "";

        errorBox.textContent =
            "❌ Please login again.";

        errorBox.style.display =
            "block";

        return;

    }


    try{

        const response =
            await fetch(

                BACKEND_URL +
                "/api/connections/" +
                encodeURIComponent(
                    user.id
                )

            );


        const data =
            await response.json();


        console.log(
            "CONNECTIONS RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(

                data.message ||
                "Unable to load connections."

            );

        }


        const connections =
            Array.isArray(
                data.connections
            )
            ? data.connections
            : [];


        if(
            connections.length === 0
        ){

            status.innerHTML = `

                🤝 No connections yet.

                <br><br>

                <small>

                    Accept a talent exchange request
                    to create a connection.

                </small>

            `;

            return;

        }


        status.innerHTML =
            `🤝 ${connections.length}
             connection${
                connections.length === 1
                ? ""
                : "s"
             }`;


        connections.forEach(

            function(connection){

                createConnectionCard(

                    connection,
                    container

                );

            }

        );


    }

    catch(error){

        console.error(
            "CONNECTION ERROR:",
            error
        );


        status.innerHTML =
            "";


        errorBox.textContent =
            "❌ " +
            error.message;


        errorBox.style.display =
            "block";

    }

}


/* =====================================================
   CREATE CONNECTION CARD
===================================================== */

function createConnectionCard(
    connection,
    container
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "connection-card";


    /*
    =====================================================
    IMPORTANT FIX
    =====================================================

    OLD:

        connection.id

    WRONG.

    connection.id is the CONNECTION TABLE ID.

    We need:

        connection.other_user_id

    This is the actual user ID of the person
    we want to chat with.
    */

    const personId =
        connection.other_user_id;


    const name =
        connection.name ||
        "User";


    const email =
        connection.email ||
        "";


    const skill =
        connection.skill ||
        "";


    const learningSkill =
        connection.learning_skill ||
        "";


    console.log(
        "CONNECTION CARD:",
        {
            connectionId:
                connection.id,

            otherUserId:
                connection.other_user_id,

            name:
                name
        }
    );


    /* =================================================
       USER SECTION
    ================================================= */

    const userSection =
        document.createElement(
            "div"
        );


    userSection.className =
        "user";


    userSection.innerHTML = `

        <div class="avatar">
            👤
        </div>

        <div>

            <h2>
                ${escapeHTML(name)}
            </h2>

            <p>
                ${escapeHTML(email)}
            </p>

        </div>

    `;


    card.appendChild(
        userSection
    );


    /* =================================================
       SKILLS
    ================================================= */

    const skills =
        document.createElement(
            "div"
        );


    skills.className =
        "skills";


    if(skill){

        const skillElement =
            document.createElement(
                "span"
            );


        skillElement.className =
            "skill";


        skillElement.textContent =
            "🛠️ " +
            skill;


        skills.appendChild(
            skillElement
        );

    }


    if(learningSkill){

        const learningElement =
            document.createElement(
                "span"
            );


        learningElement.className =
            "skill";


        learningElement.textContent =
            "📚 " +
            learningSkill;


        skills.appendChild(
            learningElement
        );

    }


    card.appendChild(
        skills
    );


    /* =================================================
       CHAT BUTTON
    ================================================= */

    const chatButton =
        document.createElement(
            "button"
        );


    chatButton.className =
        "chat-btn";


    chatButton.textContent =
        "💬 Chat";


    chatButton.addEventListener(

        "click",

        function(){

            /*
            IMPORTANT:

            Use personId = other_user_id
            */

            openChat(

                personId,

                name,

                skill

            );

        }

    );


    card.appendChild(
        chatButton
    );


    container.appendChild(
        card
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function(){

        loadConnections();

    }

);

</script>


</body>

</html>
