<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Connections | Talent Exchange</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:
    radial-gradient(circle at top right,#3b2470,transparent 35%),
    linear-gradient(135deg,#080812,#15132b);
}

nav{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    background:rgba(10,10,20,.75);
    border-bottom:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;
}

.container{
    width:88%;
    max-width:1000px;
    margin:45px auto;
}

.heading{
    text-align:center;
    margin-bottom:35px;
}

.heading h1{
    font-size:40px;
    margin-bottom:10px;
}

.heading p{
    color:#aaa;
}

.connections{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.1);
}

.avatar{
    width:65px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,#8066ff,#bd82ff);
    font-size:28px;
    margin-bottom:18px;
}

.card h2{
    margin-bottom:8px;
}

.card p{
    color:#aaa;
    margin-bottom:12px;
}

.tag{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:rgba(150,120,255,.2);
    color:#c9baff;
    font-size:13px;
}

.connected{
    margin-top:18px;
    padding:9px;
    text-align:center;
    border-radius:10px;
    background:rgba(80,200,120,.12);
    color:#86efac;
    font-size:13px;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#aaa;
}

.empty h2{
    color:white;
    margin-bottom:10px;
}

.find{
    display:inline-block;
    margin-top:22px;
    padding:13px 22px;
    border-radius:12px;
    background:linear-gradient(90deg,#8066ff,#bd82ff);
    color:white;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:800px){

    .connections{
        grid-template-columns:1fr;
    }

    .heading h1{
        font-size:30px;
    }
}
</style></head><body><nav><div class="logo">
    ✨ Talent Exchange
</div>

<a
    href="dashboard.html"
    class="back"
>
    ← Dashboard
</a>

</nav><div class="container"><div class="heading">

    <h1>
        My Connections 🤝
    </h1>

    <p>
        People you've connected with through Talent Exchange.
    </p>

</div>


<div
    class="connections"
    id="connections"
></div>


<div
    class="empty"
    id="empty"
    style="display:none;"
>

    <h2>
        No connections yet 🤝
    </h2>

    <p>
        Find someone with a skill you want to learn.
    </p>

    <a
        href="find-skills.html"
        class="find"
    >
        🔎 Find Skills
    </a>

</div>

</div><script>

const connectionList =
    JSON.parse(
        localStorage.getItem("connections") || "[]"
    );


const container =
    document.getElementById("connections");

const empty =
    document.getElementById("empty");


if(connectionList.length === 0){

    empty.style.display = "block";

}else{

    connectionList.forEach((connection,index) => {

        container.innerHTML += `

            <div class="card">

                <div class="avatar">
                    🤝
                </div>

                <h2>
                    ${connection.name}
                </h2>

                <p>
                    Can teach you:
                </p>

                <span class="tag">
                    ${connection.skill}
                </span>

                <div class="connected">
                    🟢 Connected
                </div>

            </div>

        `;

    });

}

</script></body>
</html>
