<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Register | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    background:
    radial-gradient(
        circle at top right,
        #3b2470,
        transparent 40%
    ),
    linear-gradient(
        135deg,
        #080812,
        #15132b
    );

}

.container{

    width:92%;

    max-width:430px;

    padding:30px;

    border-radius:25px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

}

.logo{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    margin-bottom:8px;

}

.subtitle{

    text-align:center;

    color:#aaa;

    margin-bottom:25px;

}

.form-group{

    margin-bottom:15px;

}

label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    color:#ddd;

}

input{

    width:100%;

    padding:13px;

    border:none;

    outline:none;

    border-radius:12px;

    background:
    rgba(255,255,255,.1);

    color:white;

    font-size:14px;

}

input::placeholder{

    color:#888;

}

button{

    width:100%;

    padding:14px;

    margin-top:10px;

    border:none;

    border-radius:12px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

}

button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.login{

    text-align:center;

    margin-top:18px;

    color:#aaa;

    font-size:14px;

}

.login a{

    color:#bd82ff;

    text-decoration:none;

    font-weight:bold;

}

</style>

</head>

<body>


<div class="container">

    <div class="logo">
        ✨ Talent Exchange
    </div>

    <div class="subtitle">
        Create your account
    </div>


    <form id="registerForm">


        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                required
            >

        </div>


        <div class="form-group">

            <label>Your Skill</label>

            <input
                type="text"
                id="skill"
                placeholder="Example: Python"
                required
            >

        </div>


        <div class="form-group">

            <label>Learning Skill</label>

            <input
                type="text"
                id="learningSkill"
                placeholder="Example: Web Development"
            >

        </div>


        <div class="form-group">

            <label>Bio</label>

            <input
                type="text"
                id="bio"
                placeholder="Tell something about yourself"
            >

        </div>


        <button
            type="submit"
            id="registerButton"
        >
            Create Account
        </button>


    </form>


    <div class="login">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


const form =
    document.getElementById("registerForm");


form.addEventListener(
    "submit",
    registerUser
);


async function registerUser(event){

    event.preventDefault();


    const button =
        document.getElementById(
            "registerButton"
        );


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim().toLowerCase();


    const password =
        document.getElementById(
            "password"
        ).value;


    const skill =
        document.getElementById(
            "skill"
        ).value.trim();


    const learningSkill =
        document.getElementById(
            "learningSkill"
        ).value.trim();


    const bio =
        document.getElementById(
            "bio"
        ).value.trim();


    if(
        !name ||
        !email ||
        !password ||
        !skill
    ){

        alert(
            "Please fill all required fields."
        );

        return;

    }


    if(password.length < 6){

        alert(
            "Password must contain at least 6 characters."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try{

        const response =
            await fetch(

                BACKEND_URL +
                "/api/signup",

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                    JSON.stringify({

                        name:name,

                        email:email,

                        password:password,

                        skill:skill,

                        learningSkill:
                            learningSkill,

                        bio:bio

                    })

                }

            );


        /*
         * IMPORTANT:
         * First read TEXT.
         * Then convert JSON.
         * This prevents:
         * Unexpected token '<'
         */

        const rawText =
            await response.text();


        console.log(
            "Backend response:",
            rawText
        );


        let result;


        try{

            result =
                JSON.parse(rawText);

        }
        catch(jsonError){

            console.error(
                "Backend returned non-JSON:",
                rawText
            );

            throw new Error(
                "Backend JSON response raaledu. Render backend URL/route check cheyyali."
            );

        }


        if(!response.ok){

            throw new Error(
                result.message ||
                "Registration failed."
            );

        }


        if(result.success){

            alert(
                "✅ Account created successfully!"
            );


            window.location.href =
                "login.html";

        }
        else{

            throw new Error(
                result.message ||
                "Registration failed."
            );

        }

    }
    catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        alert(
            "❌ " +
            error.message
        );

    }
    finally{

        button.disabled =
            false;

        button.textContent =
            "Create Account";

    }

}

</script>


</body>

</html>
