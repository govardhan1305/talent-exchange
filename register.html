<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Talent Exchange</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #090916, #24164d, #11112b);
            color: white;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #bbb;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #9b7cff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #8b6cff, #c084fc);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .login a {
            color: #b69cff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">✨ Talent Exchange</div>

        <p class="subtitle">
            Create your account and start exchanging skills.
        </p>

        <form onsubmit="registerUser(event)">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password" required>

            <label>Your Skill</label>
            <input type="text" id="skill" placeholder="Example: Web Development" required>

            <button type="submit">
                Create Account 🚀
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script>
        function registerUser(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const skill = document.getElementById("skill").value;

            localStorage.setItem("userName", name);
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userSkill", skill);

            alert("Account created successfully! 🎉");

            window.location.href = "login.html";
        }
    </script>

</body>
</html>
