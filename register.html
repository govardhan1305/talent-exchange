<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Register | Talent Exchange</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    color:white;

    background:
    radial-gradient(
        circle at top right,
        #3b2470,
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #080812,
        #15132b
    );

}

.container{

    width:100%;

    max-width:430px;

    padding:30px;

    border-radius:25px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    box-shadow:
    0 20px 60px rgba(0,0,0,.4);

}

.logo{

    text-align:center;

    font-size:28px;

    font-weight:bold;

    margin-bottom:8px;

}

.subtitle{

    text-align:center;

    color:#aaa;

    margin-bottom:25px;

}

.form-group{

    margin-bottom:16px;

}

label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    color:#ddd;

}

input,
textarea{

    width:100%;

    padding:13px 14px;

    border:none;

    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.1);

    color:white;

    font-size:14px;

    border:1px solid
    rgba(255,255,255,.08);

}

textarea{

    resize:none;

    min-height:80px;

}

input::placeholder,
textarea::placeholder{

    color:#888;

}

button{

    width:100%;

    padding:14px;

    margin-top:8px;

    border:none;

    border-radius:13px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #8066ff,
        #bd82ff
    );

}

button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.login-link{

    text-align:center;

    margin-top:20px;

    color:#aaa;

    font-size:14px;

}

.login-link a{

    color:#bd82ff;

    text-decoration:none;

    font-weight:bold;

}

.status{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:13px;

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">
        ✨ Talent Exchange
    </div>


    <div class="subtitle">
        Create your account
    </div>


    <div
        id="status"
        class="status"
    ></div>


    <form
        id="registerForm"
        onsubmit="registerUser(event)"
    >


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label for="skill">
                Your Skill
            </label>

            <input
                type="text"
                id="skill"
                placeholder="Example: Python, Editing, Drawing"
                required
            >

        </div>


        <div class="form-group">

            <label for="learningSkill">
                Skill You Want To Learn
            </label>

            <input
                type="text"
                id="learningSkill"
                placeholder="Example: JavaScript"
            >

        </div>


        <div class="form-group">

            <label for="bio">
                Bio
            </label>

            <textarea
                id="bio"
                placeholder="Tell something about yourself..."
            ></textarea>

        </div>


        <button
            type="submit"
            id="registerButton"
        >
            Create Account 🚀
        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


</div>


<script>


// =====================================================
// BACKEND URL
// =====================================================

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


// =====================================================
// REGISTER
// =====================================================

async function registerUser(event){

    event.preventDefault();


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("password")
        .value;


    const skill =
        document
        .getElementById("skill")
        .value
        .trim();


    const learningSkill =
        document
        .getElementById("learningSkill")
        .value
        .trim();


    const bio =
        document
        .getElementById("bio")
        .value
        .trim();


    const button =
        document
        .getElementById("registerButton");


    const status =
        document
        .getElementById("status");


    // =================================================
    // VALIDATION
    // =================================================

    if(
        !name ||
        !email ||
        !password ||
        !skill
    ){

        showStatus(
            "Please fill all required fields.",
            false
        );

        return;

    }


    if(password.length < 6){

        showStatus(
            "Password must contain at least 6 characters.",
            false
        );

        return;

    }


    // =================================================
    // DISABLE BUTTON
    // =================================================

    button.disabled = true;

    button.textContent =
        "Creating Account...";


    showStatus(
        "Creating your account...",
        true
    );


    try{


        // =============================================
        // API REQUEST
        // =============================================

        const response =
            await fetch(

                BACKEND_URL +
                "/api/signup",

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                    JSON.stringify({

                        name:name,

                        email:email,

                        password:password,

                        skill:skill,

                        learningSkill:
                            learningSkill,

                        bio:bio

                    })

                }

            );


        // =============================================
        // READ RESPONSE SAFELY
        // =============================================

        const contentType =
            response.headers
            .get("content-type") || "";


        let result;


        if(
            contentType.includes(
                "application/json"
            )
        ){

            result =
                await response.json();

        }
        else{

            const text =
                await response.text();

            console.error(
                "Non-JSON response:",
                text
            );


            throw new Error(
                "Server returned an invalid response. Please check the backend deployment."
            );

        }


        // =============================================
        // API ERROR
        // =============================================

        if(!response.ok){

            throw new Error(

                result.message ||
                "Registration failed."

            );

        }


        // =============================================
        // SUCCESS
        // =============================================

        showStatus(
            "Account created successfully! 🎉",
            true
        );


        alert(
            "Account created successfully! 🎉\n\nYou can login anytime using the same email and password."
        );


        // =============================================
        // GO TO LOGIN
        // =============================================

        window.location.href =
            "login.html";


    }
    catch(error){

        console.error(
            "Registration Error:",
            error
        );


        showStatus(
            "❌ " +
            (
                error.message ||
                "Unable to connect to server."
            ),
            false
        );


    }
    finally{

        button.disabled = false;

        button.textContent =
            "Create Account 🚀";

    }

}


// =====================================================
// STATUS MESSAGE
// =====================================================

function showStatus(message, success){

    const status =
        document
        .getElementById("status");


    status.style.display =
        "block";


    status.textContent =
        message;


    if(success){

        status.style.background =
            "rgba(46,204,113,.15)";

        status.style.color =
            "#62e27c";

    }
    else{

        status.style.background =
            "rgba(231,76,60,.15)";

        status.style.color =
            "#ff7675";

    }

}

</script>


</body>

</html>
