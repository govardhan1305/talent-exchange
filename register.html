<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Talent Exchange</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #090916,
                    #24164d,
                    #11112b
                );

            color: white;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 430px;

            padding: 35px;

            border-radius: 25px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #bbb;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        label {
            display: block;

            margin: 15px 0 7px;

            color: #ddd;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.08);

            color: white;

            outline: none;

            font-size: 15px;
        }

        input::placeholder {
            color: #999;
        }

        input:focus {
            border-color: #9b7cff;

            box-shadow:
                0 0 10px
                rgba(155,124,255,0.2);
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #8b6cff,
                    #c084fc
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(139,108,255,0.35);
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .login {
            text-align: center;

            margin-top: 20px;

            color: #aaa;
        }

        .login a {
            color: #b69cff;

            text-decoration: none;

            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="register-box">

        <div class="logo">
            ✨ Talent Exchange
        </div>

        <p class="subtitle">
            Create your account and start exchanging skills.
        </p>


        <!-- REGISTER FORM -->

        <form onsubmit="registerUser(event)">


            <!-- NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <!-- SKILL -->

            <label for="skill">
                Your Skill
            </label>

            <input
                type="text"
                id="skill"
                placeholder="Example: Web Development"
                required
            >


            <!-- BUTTON -->

            <button
                type="submit"
                id="registerButton"
            >
                Create Account 🚀
            </button>

        </form>


        <!-- LOGIN -->

        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <!-- ==========================================
         SIGNUP JAVASCRIPT
         ========================================== -->

   <script>

const BACKEND_URL =
    "https://talent-exchange-backend-p5wq.onrender.com";


async function registerUser(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const skill =
        document.getElementById("skill").value.trim();


    if (!name || !email || !password || !skill) {

        alert("Please fill all fields.");

        return;
    }


    try {

        const response = await fetch(
            BACKEND_URL + "/api/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    email: email,

                    password: password,

                    skill: skill

                })
            }
        );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Registration failed."
            );

        }


        alert(
            "Account created successfully! 🎉"
        );


        window.location.href =
            "login.html";


    } catch (error) {

        console.error(
            "Signup Error:",
            error
        );


        alert(
            "❌ " +
            (
                error.message ||
                "Unable to connect to server."
            )
        );

    }

}

</script>

</body>

</html>
